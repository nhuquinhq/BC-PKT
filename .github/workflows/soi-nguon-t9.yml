# Do lai cot ty gia trong file CPV BE T9 va doi chieu voi file ty gia.
#
# Sang 07/09 luc 08:18 do duoc file BE ghi tuan 37 la REV 25.382 / CO 25.900,
# trong khi file ty gia ghi 25.389 / 25.907 — lech 7d. Chi Quinh bao chieu
# 19:40 xem lai thi da khop. Do lai de xac nhan, va de biet GMV T9 doi bao
# nhieu: bao cao CPV dung thang cot "Thanh tien GMV" cua file BE chu khong tu
# quy doi, nen ty gia trong file doi la so tien doi theo.
#
# Kiem luon rang buoc REV = CO * 98% (cong thuc =EH31*98% trong file ty gia).
# Dung tren ca bang: 25.907x98%=25.389 · 25.803x98%=25.286 · 25.814x98%=25.297
# · 26.070x98%=25.549. Lech rang buoc nay la dau hieu mot trong hai cot sai.
name: Soi ty gia trong file BE T9

on:
  workflow_dispatch: {}

env:
  BE_PUB: "2PACX-1vS0Tldb2hmR8TxnYC_un9q0tpgpm3RCyN3O7oJimo17gP4EpagCRwEPwpqMr2BjdZtXeRVOcthy23PX"

jobs:
  soi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Keo file BE T9
        run: |
          U="https://docs.google.com/spreadsheets/d/e/$BE_PUB/pub?gid=0&single=true&output=csv"
          for i in $(seq 1 6); do
            rm -f /tmp/be.csv
            r=$(curl -sSL -m 110 -o /tmp/be.csv -w '%{http_code}|%{time_total}|%{size_download}' "$U" 2>/dev/null || echo '000|het gio|0')
            sz=${r##*|}
            echo "   luot $i: $r"
            case "$r" in 200*) [ "$sz" -gt 20000 ] && break ;; esac
            sleep 8
          done
          ls -l /tmp/be.csv

      - name: Doi chieu ty gia theo tuan
        run: |
          python3 - <<'PY'
          import csv, os, re, collections, unicodedata
          csv.field_size_limit(10**9)
          bd = lambda s: ''.join(c for c in unicodedata.normalize('NFD', str(s or ''))
                                 if unicodedata.category(c) != 'Mn').replace('đ','d').lower().strip()
          def viNum(s):
              s = str(s or '').strip().replace(' ', '')
              if not s: return 0.0
              if ',' in s: s = s.replace('.', '').replace(',', '.')
              elif re.fullmatch(r'-?\d{1,3}(\.\d{3})+', s): s = s.replace('.', '')
              try: return float(s)
              except ValueError: return 0.0
          n = lambda x: f'{x:,.0f}'.replace(',', '.')

          if not os.path.exists('/tmp/be.csv') or os.path.getsize('/tmp/be.csv') < 20000:
              print('khong tai duoc'); raise SystemExit(1)
          rows = list(csv.reader(open('/tmp/be.csv', encoding='utf-8', errors='ignore')))
          hdr = next(i for i, r in enumerate(rows[:40]) if any(bd(c) == 'order id' for c in r))
          cols = [c.strip() for c in rows[hdr]]
          print(f'{len(rows)} dong · tieu de {hdr} · {len(cols)} cot')

          i_tuan = next(i for i, c in enumerate(cols) if bd(c) == 'tuan')
          tg = [i for i, c in enumerate(cols) if 'ty gia tuan' in bd(c)]
          i_co, i_rev = tg[0], tg[-1]
          i_tt = next(i for i, c in enumerate(cols) if bd(c).startswith('thanh tien'))
          i_ht = next(i for i, c in enumerate(cols) if 'hoan tat' in bd(c) and 'ngay' in bd(c))
          print(f'cot: Tuan[{i_tuan}] · CO[{i_co}] · REV[{i_rev}] · Thanh tien[{i_tt}]')

          theo = collections.defaultdict(lambda: [collections.Counter(), collections.Counter(), 0, 0.0])
          tongGmv = 0.0
          for r in rows[hdr+1:]:
              g = lambda i: (r[i] if i < len(r) else '')
              if not re.search(r'\d{4}-\d{2}-\d{2}', g(i_ht)): continue
              t = str(int(viNum(g(i_tuan)))) if viNum(g(i_tuan)) else '?'
              co, rev, tt = viNum(g(i_co)), viNum(g(i_rev)), viNum(g(i_tt))
              if co: theo[t][0][co] += 1
              if rev: theo[t][1][rev] += 1
              theo[t][2] += 1; theo[t][3] += tt
              tongGmv += tt

          # So voi file ty gia (chep tay tu bang, doi chieu 07/09)
          CHUAN = {'32': (25724, 26249), '33': (25549, 26070), '34': (25282, 25798),
                   '35': (25297, 25814), '36': (25286, 25803), '37': (25389, 25907)}
          print()
          for t in sorted(theo, key=lambda x: int(x) if x.isdigit() else 99):
              cco, crev, dem, gmv = theo[t]
              co = cco.most_common(1)[0][0] if cco else 0
              rev = crev.most_common(1)[0][0] if crev else 0
              chuan = CHUAN.get(t)
              dau = '—'
              if chuan:
                  dau = 'KHOP' if (round(rev) == chuan[0] and round(co) == chuan[1]) else 'LECH'
              # Rang buoc noi bo: REV = CO * 98%
              rb = ''
              if co and rev:
                  rb = 'ok' if abs(rev - co * 0.98) <= 1 else f'VO ({rev:.0f} vs {co*0.98:.2f})'
              print(f'  tuan {t:>2}  {n(dem):>6} don · REV {rev:>9,.0f} · CO {co:>9,.0f} · '
                    f'file ty gia {chuan or "-"} → {dau} · REV=CO*98%: {rb} · GMV {n(gmv):>16}')
          print(f'\n  TONG Thanh tien GMV: {n(tongGmv)} d')
          PY
