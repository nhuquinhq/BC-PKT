# Hai nguon T9 co du gia von cho web: CPV BE T9 va Lich su vi T9.
# Do toc do va soi khuon cot truoc khi dau vao cau hinh — da vai lan dinh
# chuyen doi nguon xong moi phat hien file doi ten cot.
#
# Luot 1 (07/09): BE T9 xuat duoc 1/1 trong 19,9s, khuon cot y het file BE cu.
#   Vi T9 hong 3/3, HTTP 307 rong sau 110s.
# Luot 2: BE T9 1,54s. Doi chieu xong: [36] la REV, [35] la CO, [42] la gia von
#   VND (dung ngay truoc [43] Loi Nhuan) — dung nhu /api/cpv dang gia dinh.
#   Vi T9: publish 0/2, export 0/3, gviz 1/3 (34,4s). Chi con duong gviz.
# Luot 3: gviz an mat dong dau lam khong nhan ra tieu de. Soi lai voi
#   headers=0, va dem so dong that bang "select count(A)" de chac chan gviz
#   khong cat bot du lieu — tra ve thieu dong thi bao cao hut tien ma khong
#   bao loi, nguy hiem hon la hong han.
name: Soi nguon T9

on:
  workflow_dispatch: {}

env:
  BE_PUB: "2PACX-1vS0Tldb2hmR8TxnYC_un9q0tpgpm3RCyN3O7oJimo17gP4EpagCRwEPwpqMr2BjdZtXeRVOcthy23PX"
  VI_ID: "1PW-EuT3Z6U_GFBXlnv1HYXETjD5l556x2hKL4Zhokt4"
  VI_GID: "1425184209"

jobs:
  soi:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Tai vi T9 qua gviz
        run: |
          G="https://docs.google.com/spreadsheets/d/$VI_ID/gviz/tq?tqx=out:csv&gid=$VI_GID"
          # Dem so dong that truoc: cau truy van nay khong keo du lieu ve nen
          # nhe va nhanh, dung lam moc doi chieu voi so dong tai duoc.
          for i in 1 2 3 4 5 6; do
            r=$(curl -sSL -m 110 -o /tmp/dem.csv -w '%{http_code}|%{time_total}' "$G&tq=select%20count(A)" 2>/dev/null || echo '000|timeout')
            echo "   dem luot $i: $r · $(tr -d '\n' < /tmp/dem.csv | head -c 120)"
            case "$r" in 200*) break ;; esac
            sleep 5
          done
          echo
          for i in 1 2 3 4 5 6; do
            rm -f /tmp/vi.csv
            r=$(curl -sSL -m 110 -o /tmp/vi.csv -w '%{http_code}|%{time_total}|%{size_download}' "$G&headers=0" 2>/dev/null || echo '000|timeout|0')
            echo "   tai luot $i: $r"
            case "$r" in 200*) [ "$(stat -c%s /tmp/vi.csv)" -gt 20000 ] && break ;; esac
            sleep 5
          done
          ls -l /tmp/vi.csv || true

      - name: Soi khuon cot vi
        run: |
          python3 - <<'PY'
          import csv, os, re, collections, unicodedata
          csv.field_size_limit(10**9)
          def bd(s):
              s = unicodedata.normalize('NFD', str(s or ''))
              return ''.join(c for c in s if unicodedata.category(c) != 'Mn').replace('đ','d').lower().strip()
          def viNum(s):
              s = str(s or '').strip().replace(' ', '')
              if not s: return 0.0
              if ',' in s: s = s.replace('.', '').replace(',', '.')
              elif re.fullmatch(r'-?\d{1,3}(\.\d{3})+', s): s = s.replace('.', '')
              try: return float(s)
              except ValueError: return 0.0
          n = lambda x: f'{x:,.0f}'.replace(',', '.')

          print('##### LICH SU VI T9 (gviz, headers=0)')
          if not os.path.exists('/tmp/vi.csv') or os.path.getsize('/tmp/vi.csv') < 1000:
              print('  khong tai duoc'); raise SystemExit
          rows = list(csv.reader(open('/tmp/vi.csv', encoding='utf-8', errors='ignore')))
          print(f'  {len(rows)} dong')
          for i, r in enumerate(rows[:12]):
              print(f'   [{i}] ' + ' | '.join(x[:18] for x in r[:14]))
          hdr = next((i for i, r in enumerate(rows[:20])
                      if any(bd(c) in ('ten san','san') for c in r) and any(bd(c)=='so tien' for c in r)
                      and any(bd(c)=='tim' for c in r)), None)
          print(f'  dong tieu de: {hdr}')
          if hdr is None: raise SystemExit
          cols = [c.strip() for c in rows[hdr]]
          print(f'  {len(cols)} cot: ' + ' | '.join(cols))
          i_tim = next(i for i,c in enumerate(cols) if bd(c)=='tim')
          i_ngay = next(i for i,c in enumerate(cols) if bd(c)=='ngay')
          i_dt = next((i for i,c in enumerate(cols) if bd(c)=='dt vnd'), None)
          i_usd = next((i for i,c in enumerate(cols) if bd(c)=='so tien'), None)
          lo = next((i for i,c in enumerate(cols) if bd(c).startswith('loai don hang')), None)
          lo2 = next((i for i,c in enumerate(cols) if bd(c)=='phan loai doanh thu be'), None)
          print(f'  cot phan loai: loai don hang={lo} · phan loai doanh thu be={lo2}')
          t = collections.defaultdict(lambda: [0,0.0,0.0])
          nhan = collections.Counter()
          for r in rows[hdr+1:]:
              g = lambda i: (r[i] if (i is not None and i < len(r)) else '')
              if bd(g(i_tim)) != 'dt': continue
              d = int(viNum(g(i_ngay)) or 0)
              if not (1 <= d <= 31): continue
              t[d][0]+=1; t[d][1]+=viNum(g(i_dt)); t[d][2]+=viNum(g(i_usd))
              nhan[(g(lo2) or g(lo) or '').strip()] += 1
          tong = sum(v[1] for v in t.values()); dem = sum(v[0] for v in t.values())
          for d in sorted(t):
              c,v,u = t[d]
              print(f'     ngay {d:>2}  {n(c):>6} dong · ${u:>11,.0f} · {n(v):>16} d')
          print(f'  TONG {n(dem)} dong DT · {n(tong)} d')
          print('  nhan phan loai: ' + ', '.join(f'{k or "(rong)"}×{v}' for k,v in nhan.most_common(8)))
          PY
