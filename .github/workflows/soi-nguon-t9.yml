# Do toc do va soi khuon cot cac nguon truoc khi dau vao cau hinh — da vai lan
# dinh chuyen doi nguon xong moi phat hien file doi ten cot.
#
# Da chot qua nam luot truoc (07/09):
#   BE T9 (publish, gid 0): 1,54s va 19,9s. 37.425 dong, tieu de dong 4, 48 cot.
#     [36] REV, [35] CO, [42] gia von VND (ngay truoc [43] Loi Nhuan) — dung
#     nhu /api/cpv dang gia dinh. DA DAU VAO CAU HINH.
#   BE T8: publish 0/5, gviz cung hong. Khong con duong nao xuat duoc — muon co
#     lai so T8 thi phai xuat ban lai file hoac tai ve day vao datalake.
#   Vi T9: publish 0/2, export 0/3, gviz 1/5 va 1/6 (38–44s). Qua thap de doc
#     live — chuyen sang chup anh dinh ky, xem .github/workflows/chup-vi.yml.
#   File API san dang dung: 352 dong, TOAN BO la 08/2026, khong co cot Thanh
#     tien (la ban tho, /api/cpv tu quy doi). Tuc T9 dang thieu phan don tu
#     dong — T7 phan nay la 781.906.237 d tren tong 8.524.646.772 d, khoang 9%.
#
# Luot nay: soi file "Don hang tu dong T9" (ban V3 bot dang dung) xem co dung
# khuon de thay cho file API san khong. Diem phai kiem: co cot Gia von khong.
# Chi co GMV ma khong co gia von thi dap vao web se thanh loi nhuan ao.
name: Soi nguon T9

on:
  workflow_dispatch: {}

env:
  AUTO_T9_ID: "1GpOFicbNTmkxCCe9488516LPx31ryZTAVwS9hSxEL7U"
  AUTO_T8_ID: "1MgKdAkn_shglL0xoduuUnqhKTmJDwpCilUnJgwpmAEQ"

jobs:
  soi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Tai hai file don hang tu dong
        run: |
          keo() {
            ten="$1"; url="$2"; out="$3"
            for i in 1 2 3 4 5; do
              rm -f "$out"
              r=$(curl -sSL -m 110 -o "$out" -w '%{http_code}|%{time_total}|%{size_download}' "$url" 2>/dev/null || echo '000|to|0')
              sz=${r##*|}
              echo "   $ten luot $i: $r"
              case "$r" in 200*) [ "$sz" -gt 2000 ] && return 0 ;; esac
              sleep 5
            done
            return 1
          }
          keo "auto T9" "https://docs.google.com/spreadsheets/d/$AUTO_T9_ID/export?format=csv&gid=0" /tmp/a9.csv || true
          keo "auto T8" "https://docs.google.com/spreadsheets/d/$AUTO_T8_ID/export?format=csv&gid=0" /tmp/a8.csv || true

      - name: Doi chieu khuon cot
        run: |
          python3 - <<'PY'
          import csv, os, re, collections, unicodedata
          csv.field_size_limit(10**9)
          bd = lambda s: ''.join(c for c in unicodedata.normalize('NFD', str(s or '')) if unicodedata.category(c) != 'Mn').replace('đ','d').lower().strip()
          def viNum(s):
              s = str(s or '').strip().replace(' ', '')
              if not s: return 0.0
              if ',' in s: s = s.replace('.', '').replace(',', '.')
              elif re.fullmatch(r'-?\d{1,3}(\.\d{3})+', s): s = s.replace('.', '')
              try: return float(s)
              except ValueError: return 0.0
          def thang(s):
              m = re.search(r'(\d{4})-(\d{2})-\d{2}', str(s or ''))
              if m: return f'{m.group(2)}/{m.group(1)}'
              m = re.search(r'\d{1,2}[/-](\d{1,2})[/-](\d{4})', str(s or ''))
              return f'{int(m.group(1)):02d}/{m.group(2)}' if m else ''
          n = lambda x: f'{x:,.0f}'.replace(',', '.')

          for ten, f in (('AUTO T9', '/tmp/a9.csv'), ('AUTO T8', '/tmp/a8.csv')):
              print(f'##### {ten}')
              if not os.path.exists(f) or os.path.getsize(f) < 500:
                  print('  khong tai duoc\n'); continue
              rows = list(csv.reader(open(f, encoding='utf-8', errors='ignore')))
              hdr = next((i for i,r in enumerate(rows[:40])
                          if any(bd(c) in ('order id','order_id','ma don') for c in r)), None)
              print(f'  {len(rows)} dong · tieu de {hdr}')
              if hdr is None:
                  for r in rows[:3]: print('   ' + ' | '.join(x[:20] for x in r[:14]))
                  print(); continue
              cols = [c.strip() for c in rows[hdr]]
              print(f'  {len(cols)} cot: ' + ' | '.join(cols))
              for k in ('gia von','thanh tien','quy doi','ty gia','doanh thu','thuc nhan','san','ngay hoan tat'):
                  v = [i for i,c in enumerate(cols) if k in bd(c)]
                  print(f'     {k:<14} {v if v else "KHONG THAY"}')
              i_d = next((i for i,c in enumerate(cols) if 'hoan tat' in bd(c)), None)
              i_u = next((i for i,c in enumerate(cols) if bd(c)=='doanh thu'), None)
              i_g = next((i for i,c in enumerate(cols) if bd(c)=='gia von'), None)
              t = collections.defaultdict(lambda: [0,0.0,0.0])
              for r in rows[hdr+1:]:
                  g = lambda i: (r[i] if (i is not None and i < len(r)) else '')
                  k = thang(g(i_d))
                  if not k: continue
                  t[k][0]+=1; t[k][1]+=viNum(g(i_u)); t[k][2]+=viNum(g(i_g))
              for k in sorted(t, key=lambda x:(x[3:], x[:2])):
                  c,u,gv = t[k]
                  print(f'     thang {k}  {n(c):>6} dong · DT ${u:>11,.2f} · GV ${gv:>11,.2f}')
              print()
          PY
