# Do toc do va soi khuon cot cac nguon truoc khi dau vao cau hinh — da vai lan
# dinh chuyen doi nguon xong moi phat hien file doi ten cot.
#
# Da chot qua ba luot truoc:
#   BE T9 (publish, gid 0): xuat tot, 1,54s va 19,9s. 37.425 dong, tieu de dong 4,
#     48 cot. [36] la REV, [35] la CO, [42] la gia von VND (ngay truoc [43] Loi
#     Nhuan) — dung nhu /api/cpv dang gia dinh.
#   Vi T9: publish 0/2, export 0/3 (deu 307 rong sau 110s), gviz 1/3 trong 34,4s.
#     Nhung gviz LAM MAT TEN COT cua moi cot kieu so: So Tien, Ty gia tuan,
#     DT VND, Gia Von, Loi Nhuan deu ve rong, chi con ID/Trang thai/Ngay/Tim/
#     Ten Sheet/Phan loai. Do do khong do duoc tieu de theo ten.
#
# Luot nay: thu cac bien the headers=N xem co giu duoc ten cot khong, va do lai
# file BE T8 — neu T8 van xuat duoc thi giu trong mains, khong thi phai chot so
# vao datalake truoc khi doi nguon chinh sang T9.
name: Soi nguon T9

on:
  workflow_dispatch: {}

env:
  BE_T8_PUB: "2PACX-1vR4aNo9LBJ34PRByMwVyyvTxLKcFkh5qg4LNV1WkE-U_LF6zyNDNdNAmcovZrRzT4CdR-NQk8Y1D5O0"
  VI_ID: "1PW-EuT3Z6U_GFBXlnv1HYXETjD5l556x2hKL4Zhokt4"
  VI_GID: "1425184209"

jobs:
  soi:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Thu cac bien the gviz cho vi T9
        run: |
          G="https://docs.google.com/spreadsheets/d/$VI_ID/gviz/tq?tqx=out:csv&gid=$VI_GID"
          keo() {
            ten="$1"; url="$2"; out="$3"
            for i in 1 2 3 4 5 6 7 8; do
              rm -f "$out"
              r=$(curl -sSL -m 110 -o "$out" -w '%{http_code}|%{time_total}|%{size_download}' "$url" 2>/dev/null || echo '000|to|0')
              sz=${r##*|}
              echo "   $ten luot $i: $r"
              case "$r" in 200*) [ "$sz" -gt 20000 ] && return 0 ;; esac
              sleep 5
            done
            return 1
          }
          keo "headers=5" "$G&headers=5" /tmp/h5.csv || true
          keo "headers=-1" "$G&headers=-1" /tmp/hm.csv || true
          ls -l /tmp/h5.csv /tmp/hm.csv 2>/dev/null || true

      - name: So sanh tieu de giua cac bien the
        run: |
          python3 - <<'PY'
          import csv, os
          csv.field_size_limit(10**9)
          for ten, f in (('headers=5', '/tmp/h5.csv'), ('headers=-1', '/tmp/hm.csv')):
              print(f'##### {ten}')
              if not os.path.exists(f) or os.path.getsize(f) < 1000:
                  print('  khong tai duoc\n'); continue
              rows = list(csv.reader(open(f, encoding='utf-8', errors='ignore')))
              print(f'  {len(rows)} dong')
              for i, r in enumerate(rows[:7]):
                  print(f'   [{i}] ' + ' | '.join((x or '·')[:20] for x in r[:16]))
              print()
          PY

      - name: Do lai file BE T8
        run: |
          U="https://docs.google.com/spreadsheets/d/e/$BE_T8_PUB/pub?gid=0&single=true&output=csv"
          ok=0
          for i in 1 2 3 4 5; do
            rm -f /tmp/be8.csv
            r=$(curl -sSL -m 110 -o /tmp/be8.csv -w '%{http_code}|%{time_total}|%{size_download}' "$U" 2>/dev/null || echo '000|to|0')
            sz=${r##*|}
            g=HONG; case "$r" in 200*) [ "$sz" -gt 20000 ] && { g=OK; ok=$((ok+1)); } ;; esac
            echo "   BE T8 luot $i: $r · $g"
            sleep 4
          done
          echo "   -> $ok/5"
          python3 - <<'PY'
          import csv, os, re, collections, unicodedata
          csv.field_size_limit(10**9)
          bd = lambda s: ''.join(c for c in unicodedata.normalize('NFD', str(s or '')) if unicodedata.category(c) != 'Mn').replace('đ','d').lower().strip()
          def viNum(s):
              s = str(s or '').strip().replace(' ', '')
              if not s: return 0.0
              if ',' in s: s = s.replace('.', '').replace(',', '.')
              elif re.fullmatch(r'-?\d{1,3}(\.\d{3})+', s): s = s.replace('.', '')
              try: return float(s)
              except ValueError: return 0.0
          n = lambda x: f'{x:,.0f}'.replace(',', '.')
          if os.path.exists('/tmp/be8.csv') and os.path.getsize('/tmp/be8.csv') > 1000:
              rows = list(csv.reader(open('/tmp/be8.csv', encoding='utf-8', errors='ignore')))
              hdr = next((i for i,r in enumerate(rows[:40]) if any(bd(c)=='order id' for c in r)), None)
              cols = [c.strip() for c in rows[hdr]]
              i_tt = next(i for i,c in enumerate(cols) if bd(c).startswith('thanh tien'))
              tong = sum(viNum(r[i_tt]) for r in rows[hdr+1:] if i_tt < len(r))
              print(f'  BE T8: {len(rows)} dong · tieu de {hdr} · {len(cols)} cot · Thanh tien {n(tong)} d')
          PY
