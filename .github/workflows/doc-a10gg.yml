# Ban 2: dump chinh xac tung cot cua tab A10GG (khong cat chu, co so thu tu cot)
# de viet bo doc so cho dung. Bao cao tai chinh nen khong duoc doan.
name: Doc cau truc A10GG

on:
  workflow_dispatch: {}

jobs:
  doc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Tai tab A10GG
        run: |
          curl -sSL -m 200 -o /tmp/a10.csv \
            -w 'HTTP %{http_code} · %{time_total}s · %{size_download} byte\n' \
            "https://docs.google.com/spreadsheets/d/e/2PACX-1vQvtnyjWuhaqHvTs9rLjzGSDlZKWYww6GROPe3kDW1FBRCFrdLnuYJKXVJslEltOMWy7HpYyOqWRjJG/pub?gid=1620350371&single=true&output=csv"

      - name: Khoi tieu de - tung o mot dong
        run: |
          python3 - <<'PY'
          import csv
          rows = list(csv.reader(open('/tmp/a10.csv', encoding='utf-8', errors='ignore')))
          for i in (0, 1, 2, 3, 4, 5):
              print(f'--- DONG {i} ---')
              for j, c in enumerate(rows[i]):
                  if c.strip():
                      print(f'    cot {j:>2} = {c.strip()!r}')
          PY

      - name: Cac dong tieu de cap 1 (cot 1 co chu)
        run: |
          python3 - <<'PY'
          import csv
          rows = list(csv.reader(open('/tmp/a10.csv', encoding='utf-8', errors='ignore')))
          print('TONG DONG:', len(rows))
          for i, r in enumerate(rows):
              c1 = r[1].strip() if len(r) > 1 else ''
              if not c1:
                  continue
              ma = r[2].strip() if len(r) > 2 else ''
              vals = [(j, r[j].strip()) for j in range(6, min(len(r), 19)) if r[j].strip()]
              print(f'dong {i:>3} | cot1={c1!r} | cot2={ma!r}')
              print(f'          {vals}')
          PY

      - name: Cac dong cap 2 (cot 3 co chu) - de biet chi tiet duoi moi khoi
        run: |
          python3 - <<'PY'
          import csv
          rows = list(csv.reader(open('/tmp/a10.csv', encoding='utf-8', errors='ignore')))
          for i, r in enumerate(rows):
              c3 = r[3].strip() if len(r) > 3 else ''
              if c3:
                  tong = r[6].strip() if len(r) > 6 else ''
                  print(f'dong {i:>3} | cot3={c3!r} | TONG={tong!r}')
          PY
