# Doc cau truc file Google Sheet nguon SOP: liet ke cac tab va dump tung tab.
name: Doc cau truc SOP sheet

on:
  workflow_dispatch:
    inputs:
      gids:
        description: 'Danh sach gid muon dump them, cach nhau bang dau phay'
        required: false
        default: '200803923'

env:
  PUB: "2PACX-1vQpSDsSMPgeMKBVout6mqYm00XC0h-8ey9j3ezQNY9doH_W_Yo8yVbIVZEc57tFCJeV6OxBiHLhO0Ei"

jobs:
  doc:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Liet ke cac tab
        run: |
          for lan in 1 2 3 4 5; do
            rm -f /tmp/pub.html
            code=$(curl -sSL -m 100 -o /tmp/pub.html -w '%{http_code}' \
              "https://docs.google.com/spreadsheets/d/e/$PUB/pubhtml" || echo 000)
            sz=$(stat -c%s /tmp/pub.html 2>/dev/null || echo 0)
            echo "lan $lan: HTTP $code · $sz byte"
            [ "$code" = "200" ] && [ "$sz" -gt 2000 ] && break
            sleep 12
          done
          python3 - <<'PY'
          import re, json
          h = open('/tmp/pub.html', encoding='utf-8', errors='ignore').read()
          tabs = []
          for m in re.finditer(r'\{"name":\s*"([^"]+)"[^}]*?"gid":\s*"?(\d+)"?', h):
              tabs.append((m.group(2), m.group(1)))
          if not tabs:
              for m in re.finditer(r'gid=(\d+)[^>]*>([^<]{1,60})<', h):
                  tabs.append((m.group(1), m.group(2).strip()))
          seen = {}
          for gid, ten in tabs:
              if gid not in seen:
                  seen[gid] = ten
          print('=== CAC TAB ===')
          for gid, ten in seen.items():
              print(f'  gid={gid}  ten={ten}')
          print('TONG:', len(seen), 'tab')
          open('/tmp/gids.txt','w').write('\n'.join(seen))
          PY

      - name: Dump tung tab
        run: |
          DS=$(cat /tmp/gids.txt 2>/dev/null)
          [ -z "$DS" ] && DS="${{ inputs.gids }}"
          for g in $DS; do
            echo ""
            echo "################ TAB gid=$g ################"
            rm -f /tmp/t.csv
            for lan in 1 2 3; do
              code=$(curl -sSL -m 90 -o /tmp/t.csv -w '%{http_code}' \
                "https://docs.google.com/spreadsheets/d/e/$PUB/pub?gid=$g&single=true&output=csv" || echo 000)
              h=$(head -c 12 /tmp/t.csv 2>/dev/null | tr -d '\n')
              case "$h" in '<!DOCTYPE'*|'<html'*) sleep 10; continue ;; esac
              [ "$code" = "200" ] && break
              sleep 10
            done
            python3 - <<'PY'
          import csv
          csv.field_size_limit(10**9)
          try:
              rows = list(csv.reader(open('/tmp/t.csv', encoding='utf-8', errors='ignore')))
          except Exception as e:
              print('  khong doc duoc:', e); raise SystemExit
          print(f'  so dong: {len(rows)} · so cot max: {max((len(r) for r in rows), default=0)}')
          for i, r in enumerate(rows[:14]):
              cells = [(j, c.strip()[:40]) for j, c in enumerate(r) if c.strip()]
              print(f'  dong {i:>2}: {cells[:12] if cells else "(trong)"}')
          if len(rows) > 14:
              print(f'  ... con {len(rows)-14} dong')
          PY
          done
