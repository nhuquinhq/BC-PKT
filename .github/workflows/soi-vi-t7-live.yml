# Kiem tra /api/vi theo DUNG cau hinh PKT6 dang chay: chi con file T8 doc
# live, cac thang T4-T7 lay tu datalake. Xem T7 co ra so tu datalake khong,
# va T8 da nhan dung cot phan loai chua.
name: Soi vi PKT6

on:
  workflow_dispatch: {}

jobs:
  soi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Goi /api/vi dung cau hinh PKT6
        run: |
          U="https://bc-pkt.vercel.app/api/vi?url=https%3A%2F%2Fdocs.google.com%2Fspreadsheets%2Fd%2Fe%2F2PACX-1vTmigt_mS16GnHQ5qpx2jxv_0F9irT-jJt6c3KyfUrTn2AgbZVZ4d5Q0fBvoINSmnMJHm5GcDU58ai2%2Fpubhtml%3Fgid%3D1425184209%26single%3Dtrue&gid=1425184209&month=8&year=2026&hist=1"
          # File vi T8 Google hay xuat hut — thu nhieu lan
          cat > /tmp/co_detail.py <<'CHK'
          import json, sys
          try: sys.exit(0 if json.load(open('/tmp/vi.json')).get('detail') else 1)
          except Exception: sys.exit(1)
          CHK
          sed -i 's/^          //' /tmp/co_detail.py
          for i in 1 2 3 4 5; do
            curl -sS -m 290 -o /tmp/vi.json -w "lan $i: HTTP %{http_code} · %{time_total}s · %{size_download} byte\n" "$U" || true
            python3 /tmp/co_detail.py && break
            echo "   $(head -c 200 /tmp/vi.json)"; sleep 25
          done
          python3 - <<'PY'
          import json, collections
          d = json.load(open('/tmp/vi.json'))
          if not d.get('detail'):
              print('KHONG LAY DUOC:', d.get('error')); raise SystemExit
          n = lambda x: f'{x:,.0f}'.replace(',', '.')
          det = d['detail']
          print('meta:', {k: v for k, v in (d.get('meta') or {}).items() if k in ('rows_used','main_error','from','to')})
          for thang in ('07/2026', '08/2026'):
              rs = [r for r in det if r['ngay'].endswith('/' + thang)]
              if not rs:
                  print(f'\n{thang}: KHONG CO DONG NAO'); continue
              s = lambda k: sum(r.get(k) or 0 for r in rs)
              print(f'\n{thang}: {len(rs)} dong gop · {n(s("so_don"))} dong DT')
              print(f'   DT VND  {n(s("thanh_tien"))} · Gia von {n(s("gia_von"))}')
              print(f'   spdv: {dict(collections.Counter(r["spdv"] for r in rs))}')
          print('\nCac thang co trong ket qua:', sorted({r['ngay'][3:] for r in det}))
          PY
