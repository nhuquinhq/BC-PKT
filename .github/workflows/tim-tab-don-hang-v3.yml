# File "Bao cao don hang V3" co nhieu tab; gid 1245992231 la tab TONG HOP
# (bang theo ngay, khong co Order ID) nen /api/cpv khong doc duoc.
# Lay danh sach tab + gid tu trang /edit (file da chia se cong khai nen tai
# duoc khong can dang nhap), roi do toc do va soi khuon cot tung tab.
name: Tim tab don hang V3

on:
  workflow_dispatch: {}

env:
  DH_V3: "1AIJYxsS-SKcE-DVFWom0DqQsGJmvIo03JzBViCLJe3M"

jobs:
  tim:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Lay danh sach tab va gid
        run: |
          for u in "edit" "htmlview" "preview"; do
            curl -sSL -m 90 -o /tmp/$u.html "https://docs.google.com/spreadsheets/d/$DH_V3/$u" || true
            echo "$u: $(stat -c%s /tmp/$u.html 2>/dev/null || echo 0) byte"
          done
          python3 - <<'PY' | tee /tmp/gids.txt
          import re, html, os, json
          ra, seen = [], set()
          def them(gid, ten):
              gid = str(gid)
              if gid in seen: return
              seen.add(gid); ra.append((gid, ten))
          for f in ('/tmp/edit.html', '/tmp/htmlview.html', '/tmp/preview.html'):
              if not os.path.exists(f): continue
              s = open(f, encoding='utf-8', errors='ignore').read()
              # Bootstrap cua Sheets: [null,"Ten tab",...,gid,...] — bat cap ten + gid
              for ten, gid in re.findall(r'\\"name\\":\\"(.*?)\\",\\"(?:sheetId|gid)\\":(\d+)', s):
                  them(gid, ten)
              for ten, gid in re.findall(r'"name":"(.*?)","(?:sheetId|gid)":(\d+)', s):
                  them(gid, ten)
              # Kieu cu: menu tab o cuoi trang htmlview
              for gid, ten in re.findall(r'#gid=(\d+)[^>]*>([^<]{1,80})</a>', s):
                  them(gid, html.unescape(ten).strip())
              # Vet vot: moi so dung sau "gid=" hoac \"gid\":
              for gid in re.findall(r'gid[=\\":]{1,4}(\d{1,12})', s):
                  them(gid, '(chua ro ten)')
          for gid, ten in ra:
              try: ten = ten.encode().decode('unicode_escape')
              except Exception: pass
              print(f'{gid}\t{ten}')
          print(f'--- tong {len(ra)} gid ---')
          PY

      - name: Do toc do va soi khuon cot tung tab
        run: |
          grep -P '^\d+\t' /tmp/gids.txt | head -40 > /tmp/ds.txt || true
          # gid=0 gan nhu chac chan la tab dau tien, luon thu du co trong danh sach hay khong
          grep -qP '^0\t' /tmp/ds.txt || sed -i '1i 0\t(tab dau tien)' /tmp/ds.txt
          echo "So tab se thu: $(wc -l < /tmp/ds.txt)"
          echo
          while IFS=$'\t' read -r gid ten; do
            [ -z "$gid" ] && continue
            echo "===== gid $gid · $ten"
            rm -f /tmp/t.csv
            out=$(curl -sSL -m 120 -o /tmp/t.csv -w '%{http_code}|%{time_total}|%{size_download}' \
              "https://docs.google.com/spreadsheets/d/$DH_V3/export?format=csv&gid=$gid" 2>/dev/null || echo '000|timeout|0')
            code=${out%%|*}; rest=${out#*|}; tg=${rest%%|*}; sz=${rest##*|}
            printf '   HTTP %s · %ss · %s byte\n' "$code" "$tg" "$sz"
            if [ "$code" != "200" ]; then echo; continue; fi
            python3 - <<'PY'
          import csv, unicodedata
          csv.field_size_limit(10**9)
          def bd(s):
              s = unicodedata.normalize('NFD', str(s or ''))
              s = ''.join(c for c in s if unicodedata.category(c) != 'Mn')
              return s.replace('đ','d').replace('Đ','D').lower().strip()
          try: rows = list(csv.reader(open('/tmp/t.csv', encoding='utf-8', errors='ignore')))
          except Exception as e: print('   khong doc duoc:', e); raise SystemExit
          hdr = -1
          for i in range(min(len(rows), 40)):
              h = [bd(c) for c in rows[i]]
              if 'order id' in h or 'order_id' in h or 'ma don' in h: hdr = i; break
              if any(x == 'san' for x in h) and any(x.startswith('doanh thu') for x in h): hdr = i; break
          print(f'   {len(rows)} dong · dong tieu de: {hdr}', end='')
          if hdr < 0:
              print('  -> KHONG phai tab don hang')
              raise SystemExit
          cols = [c.strip() for c in rows[hdr]]
          def tim(*t):
              for k in t:
                  chua = k.startswith('~'); kk = k[1:] if chua else k
                  for i, c in enumerate(cols):
                      if (kk in bd(c)) if chua else (bd(c) == kk): return i
              return -1
          can = {'Order ID': tim('order id','order_id','ma don'), 'San': tim('san'),
                 'Doanh thu': tim('doanh thu','~doanh thu'), 'Thanh tien': tim('thanh tien','~thanh tien'),
                 'Trang thai': tim('trang thai','~trang thai','status'),
                 'Ngay hoan tat': tim('ngay hoan tat','~ngay hoan tat','~hoan tat'),
                 'BU': tim('bu','~khoi kd'), 'Ty gia tuan': tim('~ty gia tuan'),
                 'Loi nhuan': tim('loi nhuan','~loi nhuan')}
          thieu = [k for k, v in can.items() if v < 0]
          print(f'  -> TAB DON HANG ({len(cols)} cot)')
          for k, v in can.items():
              print(f'      {k:<14} {"cot "+str(v)+" = "+cols[v] if v >= 0 else "KHONG THAY"}')
          gv = [i for i, c in enumerate(cols) if bd(c) == 'gia von']
          print(f'      Cot ten "Gia von": {gv}')
          print(f'      >>> {"DU COT" if not thieu else "THIEU: " + ", ".join(thieu)}')
          PY
            echo
          done < /tmp/ds.txt
