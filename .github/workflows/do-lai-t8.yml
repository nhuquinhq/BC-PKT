# Do lai file T8 sau khi xuat ban lai (12/08/2026).
# Chay tu runner GitHub = may chu, giong moi truong Vercel dang goi Google.
name: Do lai T8 sau xuat ban

on:
  workflow_dispatch: {}

jobs:
  do:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Do 3 duong vao
        run: |
          do_thu() {
            echo "===== $1"
            curl -sSL -m 150 -o /tmp/o.csv \
              -w '   HTTP %{http_code} · %{time_total}s · %{size_download} byte\n' "$2" \
              || echo '   HET GIO / LOI'
            echo "   --- 200 ky tu dau ---"
            head -c 200 /tmp/o.csv | tr -d '\r'; echo
            python3 - <<'PY' || true
          try:
              n = sum(1 for _ in open('/tmp/o.csv', encoding='utf-8', errors='ignore'))
              print('   so dong:', n)
          except Exception as e:
              print('   khong doc duoc:', e)
          PY
            echo
          }

          do_thu "1. Link /pub CSV — dung y het cai app dang goi" \
            "https://docs.google.com/spreadsheets/d/e/2PACX-1vR4aNo9LBJ34PRByMwVyyvTxLKcFkh5qg4LNV1WkE-U_LF6zyNDNdNAmcovZrRzT4CdR-NQk8Y1D5O0/pub?gid=0&single=true&output=csv"

          do_thu "2. Link /export CSV cua file goc" \
            "https://docs.google.com/spreadsheets/d/19dGSq5_jl8e2X3QrmVJQuK5UKbYThces8jjC8hRxlbE/export?format=csv&gid=0"

          do_thu "3. Site that — /api/cpv doc T8" \
            "https://bc-pkt.vercel.app/api/cpv"
