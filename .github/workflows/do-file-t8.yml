# Do rieng hai file thang 8 dang lam /api/cpv va /api/vi het gio.
# Tai thang CSV tu Google, khong qua site, de biet loi o Google hay o app.
name: Do file thang 8

on:
  workflow_dispatch:

jobs:
  do:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: File don hang BE thang 8 (nguon cua PKT8 / PKT20)
        run: |
          U="https://docs.google.com/spreadsheets/d/e/2PACX-1vR4aNo9LBJ34PRByMwVyyvTxLKcFkh5qg4LNV1WkE-U_LF6zyNDNdNAmcovZrRzT4CdR-NQk8Y1D5O0/pub?gid=0&single=true&output=csv"
          for i in 1 2; do
            printf 'luot %s  ' "$i"
            curl -sSL -m 280 -o /tmp/be8_$i.csv \
              -w 'HTTP %{http_code} · %{time_total}s · %{size_download} byte\n' "$U" || echo "HET GIO / LOI"
          done
          ls -l /tmp/be8_*.csv 2>/dev/null || true
          head -c 200 /tmp/be8_1.csv 2>/dev/null; echo
          python3 -c "print('so dong:', sum(1 for _ in open('/tmp/be8_1.csv', encoding='utf-8', errors='ignore')))" || true

      - name: File don hang BE thang 7 (de so sanh)
        run: |
          U="https://docs.google.com/spreadsheets/d/e/2PACX-1vS8v730AMvL4_1VC131-HLHBECPrYMtLmv02TkTtpFuXlQEGtVSPpR1URMQ5sOhB6_LbnATeDwZUk__/pub?gid=0&single=true&output=csv"
          curl -sSL -m 280 -o /tmp/be7.csv \
            -w 'HTTP %{http_code} · %{time_total}s · %{size_download} byte\n' "$U" || echo "HET GIO / LOI"

      - name: File vi thang 8 (nguon cua PKT6 / PKT20 xem theo vi)
        run: |
          U="https://docs.google.com/spreadsheets/d/e/2PACX-1vTmigt_mS16GnHQ5qpx2jxv_0F9irT-jJt6c3KyfUrTn2AgbZVZ4d5Q0fBvoINSmnMJHm5GcDU58ai2/pub?gid=1425184209&single=true&output=csv"
          curl -sSL -m 280 -o /tmp/vi8.csv \
            -w 'HTTP %{http_code} · %{time_total}s · %{size_download} byte\n' "$U" || echo "HET GIO / LOI"
          head -c 200 /tmp/vi8.csv 2>/dev/null; echo

      - name: File vi thang 7 (de so sanh)
        run: |
          U="https://docs.google.com/spreadsheets/d/e/2PACX-1vQumf3iUT9n-lh-sNiJ1TeV24RjqRm1Eo6RTMafFsN9g_Hr6qtKZfyjFzb4gBpo5QhTieMSqU4sJORx/pub?gid=1106881524&single=true&output=csv"
          curl -sSL -m 280 -o /tmp/vi7.csv \
            -w 'HTTP %{http_code} · %{time_total}s · %{size_download} byte\n' "$U" || echo "HET GIO / LOI"
