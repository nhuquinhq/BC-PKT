# Do rieng cac file thang 8 dang lam /api/cpv va /api/vi het gio.
# Tai thang CSV tu Google, khong qua site, de biet loi o Google hay o app.
name: Do file thang 8

on:
  workflow_dispatch:

jobs:
  do:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: CPV BE thang 8 - link /export cua file goc (19dGSq...)
        run: |
          U="https://docs.google.com/spreadsheets/d/19dGSq5_jl8e2X3QrmVJQuK5UKbYThces8jjC8hRxlbE/export?format=csv&gid=0"
          curl -sSL -m 280 -o /tmp/be8_export.csv \
            -w 'HTTP %{http_code} · %{time_total}s · %{size_download} byte\n' "$U" || echo "HET GIO / LOI"
          head -c 300 /tmp/be8_export.csv; echo
          python3 -c "print('so dong:', sum(1 for _ in open('/tmp/be8_export.csv', encoding='utf-8', errors='ignore')))" || true

      - name: CPV BE thang 8 - link /pub dang cau hinh trong app
        run: |
          U="https://docs.google.com/spreadsheets/d/e/2PACX-1vR4aNo9LBJ34PRByMwVyyvTxLKcFkh5qg4LNV1WkE-U_LF6zyNDNdNAmcovZrRzT4CdR-NQk8Y1D5O0/pub?gid=0&single=true&output=csv"
          curl -sSL -m 280 -o /tmp/be8_pub.csv \
            -w 'HTTP %{http_code} · %{time_total}s · %{size_download} byte\n' "$U" || echo "HET GIO / LOI"
          head -c 200 /tmp/be8_pub.csv; echo

      - name: Vi thang 8 - link /pub dang cau hinh
        run: |
          U="https://docs.google.com/spreadsheets/d/e/2PACX-1vTmigt_mS16GnHQ5qpx2jxv_0F9irT-jJt6c3KyfUrTn2AgbZVZ4d5Q0fBvoINSmnMJHm5GcDU58ai2/pub?gid=1425184209&single=true&output=csv"
          curl -sSL -m 280 -o /tmp/vi8.csv \
            -w 'HTTP %{http_code} · %{time_total}s · %{size_download} byte\n' "$U" || echo "HET GIO / LOI"
          head -c 200 /tmp/vi8.csv; echo

      - name: Vi thang 8 - link /export cua file goc (14hhgFl...)
        run: |
          U="https://docs.google.com/spreadsheets/d/14hhgFlw7UXZZXV7DWxL7wyS-Tub46dwFrl5bI6F806Q/export?format=csv&gid=1425184209"
          curl -sSL -m 280 -o /tmp/vi8_export.csv \
            -w 'HTTP %{http_code} · %{time_total}s · %{size_download} byte\n' "$U" || echo "HET GIO / LOI"
          head -c 200 /tmp/vi8_export.csv; echo
