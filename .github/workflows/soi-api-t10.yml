# File API T10 — ban cong bo doc duoc, 31 cot dung khuon file T9, nhung tong
# Gia von ra $15.834.200 trong khi Doanh thu chi $6.136. Lech 2.500 lan.
# Phai soi GIA TRI THO truoc khi dau vao bot: doc sai cot gia von la bot bao
# lai ao, ma no khong he bao loi.
#
# Link /edit chi Quinh dua tra TRANG DANG NHAP — file chua mo "ai co link",
# nen chi con duong cong bo. Do luon qua Vercel vi bot chay tren do.
name: Soi API T10

on:
  workflow_dispatch: {}

env:
  FID: "1oBmAyyt5LMNNaivHPT7fp_2JktqjjbvItgftQ7sPT8I"
  PUB: "2PACX-1vQu2DaU7ZJYev-aVlli-xArdakHP1BTCdJgJCaFmCJbvxYNM19FHakx99kHSisRJ2w6SMFR5zDzqsvi"
  T9: "1GpOFicbNTmkxCCe9488516LPx31ryZTAVwS9hSxEL7U"
  GOC: "https://bc-pkt.vercel.app"

jobs:
  soi:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Keo T10 (cong bo) va T9 (de doi chieu)
        run: |
          for i in 1 2 3 4; do
            rm -f /tmp/t10.csv
            r=$(curl -sSL -m 110 -o /tmp/t10.csv -w '%{http_code}|%{time_total}|%{size_download}' \
              "https://docs.google.com/spreadsheets/d/e/$PUB/pub?gid=0&single=true&output=csv" 2>/dev/null || echo '000|het gio|0')
            echo "   T10 cong bo luot $i: $r"
            case "$r" in 200*) break ;; esac
            sleep 5
          done
          for i in 1 2 3 4; do
            rm -f /tmp/t9.csv
            r=$(curl -sSL -m 110 -o /tmp/t9.csv -w '%{http_code}|%{time_total}|%{size_download}' \
              "https://docs.google.com/spreadsheets/d/$T9/export?format=csv&gid=0" 2>/dev/null || echo '000|het gio|0')
            echo "   T9 export luot $i: $r"
            case "$r" in 200*) break ;; esac
            sleep 5
          done

      - name: Qua Vercel
        run: |
          PUBU="https://docs.google.com/spreadsheets/d/e/$PUB/pubhtml?gid=0&single=true"
          for i in 1 2 3; do
            r=$(curl -sS -m 290 -G "$GOC/api/sheet" \
              --data-urlencode "url=$PUBU" --data-urlencode 'gid=0' --data-urlencode 'raw=1' \
              -o /tmp/v.json -w '%{http_code}|%{time_total}|%{size_download}' 2>/dev/null || echo '000|het gio|0')
            echo "   Vercel cong bo luot $i: $r · $(head -c 80 /tmp/v.json)"
            sleep 4
          done

      - name: Soi gia tri tho cot Gia von
        run: |
          python3 - <<'PY'
          import csv, os, re, collections, unicodedata
          csv.field_size_limit(10**9)
          bd = lambda s: ''.join(c for c in unicodedata.normalize('NFD', str(s or ''))
                                 if unicodedata.category(c) != 'Mn').replace('đ','d').lower().strip()
          def viNum(s):
              s = str(s or '').strip().replace(' ', '')
              if not s: return 0.0
              if ',' in s: s = s.replace('.', '').replace(',', '.')
              elif re.fullmatch(r'-?\d{1,3}(\.\d{3})+', s): s = s.replace('.', '')
              try: return float(s)
              except ValueError: return 0.0

          for ten, f in (('T10', '/tmp/t10.csv'), ('T9 (doi chieu)', '/tmp/t9.csv')):
              print(f'##### {ten}')
              if not os.path.exists(f) or os.path.getsize(f) < 300:
                  print('  khong doc duoc\n'); continue
              rows = list(csv.reader(open(f, encoding='utf-8', errors='ignore')))
              hdr = next(i for i, r in enumerate(rows[:40]) if any(bd(c) == 'order id' for c in r))
              cols = [c.strip() for c in rows[hdr]]
              i_u = next(i for i,c in enumerate(cols) if bd(c) == 'doanh thu')
              i_g = next(i for i,c in enumerate(cols) if bd(c) == 'gia von')
              i_s = next(i for i,c in enumerate(cols) if bd(c) == 'san')
              print(f'  {len(rows)-hdr-1} dong · Doanh thu[{i_u}] · Gia von[{i_g}]')
              # 12 gia tri tho dau tien
              print('  12 dong dau (San · Doanh thu THO · Gia von THO -> viNum):')
              d = 0
              for r in rows[hdr+1:]:
                  if len(r) <= i_g: continue
                  d += 1
                  if d > 12: break
                  print(f'     {r[i_s]:<5} | DT {r[i_u]!r:>12} | GV {r[i_g]!r:>14} -> {viNum(r[i_g]):,.2f}')
              # Phan bo do lon cua gia von
              bucket = collections.Counter()
              lon = []
              for r in rows[hdr+1:]:
                  if len(r) <= i_g: continue
                  v = viNum(r[i_g])
                  if v <= 0: bucket['= 0'] += 1
                  elif v < 100: bucket['< 100'] += 1
                  elif v < 10000: bucket['100 - 10k'] += 1
                  else:
                      bucket['>= 10k'] += 1
                      if len(lon) < 8: lon.append((r[i_s], r[i_u], r[i_g]))
              print(f'  phan bo gia von: {dict(bucket)}')
              if lon:
                  print('  vai dong gia von LON:')
                  for s, u, g in lon:
                      print(f'     {s:<5} | DT {u!r:>12} | GV {g!r}')
              print()
          PY
