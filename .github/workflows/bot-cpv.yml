# Đồng hồ hẹn giờ cho bot CPV Telegram. Cron của GitHub hay bị trễ /
# bỏ chuyến lúc cao điểm (đã dính: bỏ hẳn khung 10h & 15h ngày 04/08),
# nên gọi DÀY mỗi 15 phút (né phút :00 đông đúc) với ?auto=1 — server
# tự quyết: chỉ bắn đúng khung 10·15·18·21·23h VN, mỗi khung 1 lần
# (khóa chống trùng nằm ở Upstash KV). Dùng GitHub Actions vì Vercel
# gói Hobby chỉ cho cron chạy 1 lần/ngày.
name: Bot CPV Telegram

on:
  schedule:
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch: {}

jobs:
  ban-cpv:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Goi endpoint bot
        run: |
          for i in 1 2 3; do
            code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -m 120 "https://bc-pkt.vercel.app/api/bot/cpv?auto=1") && [ "$code" = "200" ] && break
            echo "Lan $i loi (HTTP $code), thu lai sau 30s..."; cat /tmp/resp.json || true; sleep 30
          done
          cat /tmp/resp.json
          [ "$code" = "200" ]
