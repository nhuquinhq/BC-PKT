# Đồng hồ hẹn giờ cho bot CPV Telegram. Cron của GitHub hay bị trễ /
# bỏ chuyến lúc cao điểm (đã dính: bỏ hẳn khung 10h & 15h ngày 04/08),
# nên gọi NHIỀU LẦN quanh giờ hẹn (né phút :00 đông đúc) với ?auto=1 —
# server tự quyết: chỉ bắn đúng khung 12h · 18h · 23h30 VN, mỗi khung
# 1 lần (khóa chống trùng nằm ở Upstash KV). Ping chạy CẢ NGÀY mỗi
# 15 phút — đã dính vụ GitHub hoãn chuyến tới 4 tiếng (04/08) nên nếu
# chỉ đặt ping quanh giờ hẹn là trễ phát trôi luôn cửa sổ; ping cả
# ngày thì luôn có chuyến rơi vào cửa sổ. Dùng GitHub Actions vì
# Vercel gói Hobby chỉ cho cron chạy 1 lần/ngày.
name: Bot CPV Telegram

on:
  schedule:
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:
    inputs:
      ban_ngay:
        description: 'Bắn ngay lập tức, bỏ qua khung giờ (true/false)'
        required: false
        default: 'true'

jobs:
  ban-cpv:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Goi endpoint bot
        run: |
          # Chay tay voi ban_ngay=true thi bo ?auto=1 -> gui ngay khong xet khung gio
          URL="https://bc-pkt.vercel.app/api/bot/cpv?auto=1"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.ban_ngay }}" = "true" ]; then
            URL="https://bc-pkt.vercel.app/api/bot/cpv"
          fi
          for i in 1 2 3; do
            code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -m 120 "$URL") && [ "$code" = "200" ] && break
            echo "Lan $i loi (HTTP $code), thu lai sau 30s..."; cat /tmp/resp.json || true; sleep 30
          done
          cat /tmp/resp.json
          [ "$code" = "200" ]
