# Nguon bot CPV thang 11 — chi Quinh dua hai link ngay 01/11.
#
# Hai link KHONG CUNG GID: link /edit ghi gid=1512098159, link xuat ban ghi
# gid=0. Phai biet tab don hang la tab nao truoc khi cam, nen do CA HAI gid
# tren CA HAI duong.
#
# Do QUA VERCEL vi bot goi https://bc-pkt.vercel.app/api/bot/cpv — chinh
# Vercel la ben doc file. Bai hoc 15/09: cung file BE T9 ma tu GitHub /export
# chay 5/5 trong 1,5s, qua Vercel 0/3 va HTTP 400 sau 240s. So do tu GitHub
# khong noi duoc gi ve Vercel.
#
# Soi luon COT GIA VON: file V3 T10 lan hai don vi — 282 dong ghi USD dung
# nhung 27 dong ghi bang VND, nen khong duoc dua vao web. Phai biet file T11
# co tat do khong.
name: Soi V3 T11

on:
  workflow_dispatch: {}

env:
  FID: "1SOmLSjAHwPfkrTQtJlNn3nFenl4-wMNVzmm34F6-zjA"
  PUB: "2PACX-1vQKVL2GuVWoliN6Az9xj4DNHsEV1o_nZNfBwOjHbNJsCWRhBKoiNrLEHngslyin06O3u_31ArJjyVsm"
  GOC: "https://bc-pkt.vercel.app"

jobs:
  soi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Qua Vercel — hai duong x hai gid
        run: |
          qua() {
            ten="$1"; url="$2"; gid="$3"; out="$4"
            r=$(curl -sS -m 290 -G "$GOC/api/sheet" \
              --data-urlencode "url=$url" --data-urlencode "gid=$gid" --data-urlencode 'raw=1' \
              -o "$out" -w '%{http_code}|%{time_total}|%{size_download}' 2>/dev/null || echo '000|het gio|0')
            echo "   $ten gid=$gid: $r"
            head -c 150 "$out" 2>/dev/null | tr -d '\n'; echo
          }
          qua "cong bo" "https://docs.google.com/spreadsheets/d/e/$PUB/pubhtml?gid=0&single=true" 0        /tmp/p0.json
          qua "cong bo" "https://docs.google.com/spreadsheets/d/e/$PUB/pubhtml?gid=0&single=true" 1512098159 /tmp/p1.json
          qua "export " "https://docs.google.com/spreadsheets/d/$FID/edit?gid=0"                   0        /tmp/e0.json
          qua "export " "https://docs.google.com/spreadsheets/d/$FID/edit?gid=1512098159"          1512098159 /tmp/e1.json

      - name: Soi khuon cot va so lieu
        run: |
          python3 -I - <<'PY'
          import json, os, re, collections
          def bd(s):
              import unicodedata
              return ''.join(c for c in unicodedata.normalize('NFD', str(s or ''))
                             if unicodedata.category(c) != 'Mn').replace('đ','d').lower().strip()
          def viNum(s):
              s = str(s or '').strip().replace(' ', '')
              if not s: return 0.0
              if ',' in s: s = s.replace('.', '').replace(',', '.')
              elif re.fullmatch(r'-?\d{1,3}(\.\d{3})+', s): s = s.replace('.', '')
              try: return float(s)
              except ValueError: return 0.0
          n = lambda x: f'{x:,.0f}'.replace(',', '.')

          for ten, f in (('CONG BO gid=0','/tmp/p0.json'), ('CONG BO gid=1512098159','/tmp/p1.json'),
                         ('EXPORT gid=0','/tmp/e0.json'), ('EXPORT gid=1512098159','/tmp/e1.json')):
              print(f'##### {ten}')
              try:
                  j = json.load(open(f))
              except Exception as e:
                  print(f'  khong doc duoc: {e}\n'); continue
              if j.get('error'):
                  print(f'  LOI: {j["error"][:120]}\n'); continue
              g = j.get('grid') or []
              print(f'  {len(g)} dong')
              hdr = next((i for i, r in enumerate(g[:40]) if any(bd(c) == 'order id' for c in r)), None)
              if hdr is None:
                  for i, r in enumerate(g[:5]):
                      print('   [%d] ' % i + ' | '.join((str(x).strip() or '·')[:18] for x in r[:14]))
                  print(); continue
              cols = [str(c).strip() for c in g[hdr]]
              print(f'  tieu de dong {hdr} · {len([c for c in cols if c])} o co ten')
              print('   ' + ' | '.join(f'{j2}:{c[:20]}' for j2, c in enumerate(cols) if c))
              idx = lambda *ten2: next((i for i, c in enumerate(cols) if bd(c) in ten2), None)
              i_ht = next((i for i, c in enumerate(cols) if 'hoan tat' in bd(c) or 'hoan thanh' in bd(c)), None)
              i_st = idx('trang thai')
              i_dt = idx('doanh thu')
              i_gv = next((i for i, c in enumerate(cols) if bd(c).startswith('gia von')), None)
              i_tt = next((i for i, c in enumerate(cols) if 'thanh tien' in bd(c) or 'quy doi' in bd(c)), None)
              print(f'  Ngay hoan tat[{i_ht}] · Trang thai[{i_st}] · Doanh thu[{i_dt}] · Gia von[{i_gv}] · Thanh tien[{i_tt}]')
              t = collections.defaultdict(lambda: [0, 0.0])
              st = collections.Counter()
              gv_vnd = gv_usd = 0
              for r in g[hdr+1:]:
                  gg = lambda i: (r[i] if (i is not None and i < len(r)) else '')
                  st[str(gg(i_st))[:14]] += 1
                  if i_gv is not None and i_dt is not None:
                      v, d = viNum(gg(i_gv)), viNum(gg(i_dt))
                      if v > 1000 and d < 1000 and d > 0: gv_vnd += 1
                      elif v > 0: gv_usd += 1
                  m = re.search(r'(\d{4})-(\d{2})-(\d{2})', str(gg(i_ht)))
                  if not m: continue
                  k = f'{m.group(3)}/{m.group(2)}'
                  t[k][0] += 1
                  t[k][1] += viNum(gg(i_tt)) if i_tt is not None else 0
              print(f'  trang thai: {dict(st.most_common(4))}')
              print(f'  cot Gia von: {n(gv_usd)} dong kieu USD · {n(gv_vnd)} dong kieu VND'
                    f'{"  <-- LAN DON VI nhu file T10" if gv_vnd else ""}')
              for k in sorted(t, key=lambda x: (x[3:], x[:2]))[:8]:
                  print(f'     {k}  {n(t[k][0]):>6} don · {n(t[k][1]):>14} d')
              print(f'  TONG {n(sum(v[0] for v in t.values()))} don · {n(sum(v[1] for v in t.values()))} d')
              print()
          PY
