# Soi tab WEEKLY RATE Ver2 (gid 1739295342) qua CA HAI duong chi Quinh dua:
#   1. Ban cong bo  (/d/e/2PACX-.../pub)
#   2. File goc     (/d/1tMLW.../gviz — KHONG dung /export, xem ben duoi)
#
# Da do ngay 07/09:
#   cong bo: 76 dong x 361 cot, boc duoc 19 tuan
#   gviz   : 49 dong x 361 cot, boc duoc dung 19 tuan do, so y het
#   export : tra TRANG DANG NHAP — file chua mo quyen "ai co link"
#   Sau tuan khop dung anh chup: 32 REV 25.724 · 33 25.549 · 34 25.282
#   35 25.297 · 36 25.286 · 37 25.389 (CO lan luot 26.249/26.070/25.798/
#   25.814/25.803/25.907)
#
# Luot nay chay THEM bo boc cua PKT1 (lib/weeklyRate.js) tren chinh byte tai
# ve. PKT1 co bo boc RIENG, khong dung chung voi lib/tyGia.js — doi tab ma
# khong thu thi de trang PKT1 trang bang ma khong ai biet.
name: Soi ty gia Ver2

on:
  workflow_dispatch: {}

env:
  PUB: "2PACX-1vRBzYH7dMHHBU1PhVf368oCNlLhKhGFclc4VuH9nucqShlrk5fxbYtUUBUUAbYXzm7c3nXO6P7Yb9vQ"
  FID: "1tMLW_mB8U08CQvE-lPBoLYAbjjs2Cc78t5bLHWTsK48"
  GID: "1739295342"

jobs:
  soi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cai goi
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Keo hai duong
        run: |
          thu() {
            ten="$1"; url="$2"; out="$3"
            for i in 1 2 3; do
              rm -f "$out"
              r=$(curl -sSL -m 110 -o "$out" -w '%{http_code}|%{time_total}|%{size_download}' "$url" 2>/dev/null || echo '000|het gio|0')
              sz=${r##*|}
              h=$(head -c 14 "$out" 2>/dev/null | tr -d '\n')
              g=HONG
              case "$h" in '<!DOCTYPE'*|'<html'*) g='TRANG DANG NHAP' ;;
                *) case "$r" in 200*) [ "$sz" -gt 500 ] && g=OK ;; esac ;;
              esac
              echo "   $ten luot $i: $r · $g"
              [ "$g" = OK ] && return 0
              sleep 5
            done
            return 1
          }
          thu "cong bo" "https://docs.google.com/spreadsheets/d/e/$PUB/pub?gid=$GID&single=true&output=csv" /tmp/a.csv || true
          thu "gviz"    "https://docs.google.com/spreadsheets/d/$FID/gviz/tq?tqx=out:csv&gid=$GID&headers=0" /tmp/b.csv || true

      - name: Chay bo boc cua PKT1 tren ca hai duong
        run: |
          # lib/weeklyRate.js la ESM nhung package.json khong dat type:module
          # nen node tran doc .js la CommonJS. Chep sang .mjs de import duoc,
          # KHONG sua file that — muc dich la thu dung ban dang chay.
          # Script phai nam TRONG thu muc repo, khong thi node khong tim ra
          # node_modules de import papaparse.
          cp lib/weeklyRate.js ./weeklyRate-tam.mjs
          cat > ./thu-tam.mjs <<'JS'
          import fs from 'node:fs';
          import Papa from 'papaparse';
          import { parseWeeklyRate } from './weeklyRate-tam.mjs';
          const n = (x) => new Intl.NumberFormat('vi-VN', { maximumFractionDigits: 2 }).format(x);
          for (const [ten, f] of [['CONG BO', '/tmp/a.csv'], ['GVIZ', '/tmp/b.csv']]) {
            console.log(`##### PKT1 doc ${ten}`);
            if (!fs.existsSync(f) || fs.statSync(f).size < 500) { console.log('  khong tai duoc\n'); continue; }
            const grid = Papa.parse(fs.readFileSync(f, 'utf8').trim(), { header: false, skipEmptyLines: false }).data;
            try {
              const p = parseWeeklyRate(grid);
              console.log(`  ${p.weeks.length} tuan · ${p.rows.length} dong chi so · ${(p.tidy || []).length} dong tidy`);
              for (const w of p.weeks.slice(-4)) console.log(`     tuan ${w.week} (${w.year}/${w.month}) ${w.from} -> ${w.to}`);
              console.log('  KPI:', JSON.stringify(p.kpis));
              const co = p.rows.find((r) => /co rate/i.test(r.kind || ''));
              const re = p.rows.find((r) => /rev rate/i.test(r.kind || ''));
              for (const [t, r] of [['REV Rate', re], ['CO Rate', co]]) {
                if (!r) { console.log(`     ${t}: KHONG THAY dong`); continue; }
                const v = (r.cells || []).slice(-4).map((c) => (c && c.n != null ? n(c.n) : '·'));
                console.log(`     ${t}: 4 tuan cuoi = ${v.join(' | ')}`);
              }
            } catch (e) {
              console.log('  LOI:', e.message);
            }
            console.log();
          }
          JS
          node ./thu-tam.mjs
          rm -f ./thu-tam.mjs ./weeklyRate-tam.mjs
