# Doc file CPV BE T8. Google xuat file nay luc duoc luc khong nen cu thu
# lai nhieu lan — thuc te lan 3 thuong an. Ban truoc tai duoc file roi ma
# chi in so dong vi phan phan tich chi viet cho nhanh API; nay phan tich
# thang tren CSV.
name: Doc file T8

on:
  workflow_dispatch: {}

env:
  PUB: "2PACX-1vR4aNo9LBJ34PRByMwVyyvTxLKcFkh5qg4LNV1WkE-U_LF6zyNDNdNAmcovZrRzT4CdR-NQk8Y1D5O0"

jobs:
  doc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Tai CSV - thu toi 8 lan
        run: |
          U="https://docs.google.com/spreadsheets/d/e/$PUB/pub?gid=0&single=true&output=csv"
          for lan in 1 2 3 4 5 6 7 8; do
            rm -f /tmp/t8.csv
            code=$(curl -sSL -m 100 -o /tmp/t8.csv -w '%{http_code}' "$U" || echo 000)
            sz=$(stat -c%s /tmp/t8.csv 2>/dev/null || echo 0)
            h=$(head -c 12 /tmp/t8.csv 2>/dev/null | tr -d '\n')
            echo "lan $lan: HTTP $code · $sz byte"
            case "$h" in '<!DOCTYPE'*|'<html'*) echo '   -> trang loi HTML'; sleep 15; continue ;; esac
            if [ "$code" = "200" ] && [ "$sz" -gt 100000 ]; then echo "   -> DUOC ($sz byte)"; exit 0; fi
            sleep 15
          done
          echo "KHONG TAI DUOC SAU 8 LAN"
          exit 1

      - name: Phan tich
        run: |
          python3 - <<'PY'
          import csv, re, collections, unicodedata
          csv.field_size_limit(10**9)
          rows = list(csv.reader(open('/tmp/t8.csv', encoding='utf-8', errors='ignore')))
          n = lambda x: f'{x:,.0f}'.replace(',', '.')
          print('TONG DONG TRONG FILE:', len(rows))

          def norm(s):
              s = unicodedata.normalize('NFD', str(s or '')).lower()
              return ''.join(c for c in s if not unicodedata.combining(c)).replace('đ','d').strip()

          print('\n===== KHOI TIEU DE =====')
          for i in range(min(4, len(rows))):
              cells = [(j, c.strip()[:32]) for j, c in enumerate(rows[i]) if c.strip()]
              if cells: print(f'  dong {i}: {cells[:10]}')

          hdr = -1
          for i in range(min(25, len(rows))):
              ns = [norm(c) for c in rows[i]]
              if any(c in ('san','ma san') for c in ns) and any('thanh tien' in c or 'gia von' in c for c in ns):
                  hdr = i; break
          if hdr < 0:
              for i in range(min(25, len(rows))):
                  if sum(1 for c in rows[i] if c.strip() and not re.fullmatch(r'[\d.,\-]+', c.strip())) >= 8:
                      hdr = i; break
          cols = [c.strip() for c in rows[hdr]] if hdr >= 0 else []
          print(f'\n===== DONG TIEU DE = dong {hdr} =====')
          print('  ' + ' | '.join(f'{j}:{c}' for j, c in enumerate(cols) if c))

          data = rows[hdr+1:] if hdr >= 0 else []
          def tim(*tu):
              for j, c in enumerate(cols):
                  nc = norm(c)
                  if all(t in nc for t in tu): return j
              return -1
          idx = {'ngay':tim('ngay'), 'san':tim('san'), 'thanh_tien':tim('thanh','tien'),
                 'gia_von':tim('gia','von'), 'trang_thai':tim('trang','thai'),
                 'loai_dv':tim('loai','dich','vu'), 'bu':tim('bu'), 'usd':tim('usd')}
          print('\n===== COT NHAN DIEN =====')
          for k, j in idx.items():
              print(f'  {k:<11} -> cot {j}' + (f'  ({cols[j]})' if j >= 0 else '   [KHONG THAY]'))

          def viNum(s):
              s = str(s or '').strip().replace(' ', '')
              if not s or s == '-': return 0.0
              am = s.startswith('-') or (s.startswith('(') and s.endswith(')'))
              s = s.strip('()-')
              if ',' in s and '.' in s: s = s.replace('.','').replace(',','.')
              elif re.search(r',\d{1,2}$', s): s = s.replace('.','').replace(',','.')
              else: s = re.sub(r'[.,](?=\d{3}\b)', '', s)
              try: v = float(s)
              except ValueError: return 0.0
              return -v if am else v
          val = lambda r, k: (r[idx[k]] if 0 <= idx[k] < len(r) else '')

          tt=collections.Counter(); ngayCo=collections.Counter()
          agg=lambda: collections.defaultdict(lambda:[0,0.0,0.0])
          bySan, byBu, byDv, byNgay = agg(), agg(), agg(), agg()
          tien=von=usd=0.0; dem=0; von0=0; thieuSan=0
          for r in data:
              if not any(c.strip() for c in r): continue
              dem += 1
              t = viNum(val(r,'thanh_tien')); v = viNum(val(r,'gia_von')); u = viNum(val(r,'usd'))
              tien += t; von += v; usd += u
              tt[val(r,'trang_thai').strip() or '(trong)'] += 1
              s = val(r,'san').strip() or '(trong)'
              if s == '(trong)': thieuSan += 1
              for box, key in ((bySan, s), (byBu, val(r,'bu').strip() or '—'),
                               (byDv, val(r,'loai_dv').strip() or '—')):
                  box[key][0] += 1; box[key][1] += t; box[key][2] += v
              d = val(r,'ngay').strip()[:10]
              mm = re.match(r'(\d{1,2})[/-](\d{1,2})', d)
              if mm:
                  k = f'{int(mm.group(1)):02d}/{int(mm.group(2)):02d}'
                  ngayCo[k] += 1
                  byNgay[k][0] += 1; byNgay[k][1] += t; byNgay[k][2] += v
              if t and not v: von0 += 1

          print(f'\n===== TONG ({n(dem)} dong don) =====')
          print(f'  Doanh thu goc (USD): {usd:,.2f}')
          print(f'  Thanh tien (VND)   : {n(tien)}')
          print(f'  Gia von            : {n(von)}')
          print(f'  Loi nhuan gop      : {n(tien-von)}')
          if tien:
              print(f'  % gia von / DT     : {von/tien*100:.2f}%')
              print(f'  Bien loi nhuan gop : {(tien-von)/tien*100:.2f}%')

          print('\n===== TRANG THAI DON =====')
          for k, c in tt.most_common(10): print(f'  {n(c):>7}  {k}')

          def inBang(box, ten, lim=30):
              print(f'\n===== THEO {ten} ({len(box)}) =====')
              for k, v in sorted(box.items(), key=lambda x: -x[1][1])[:lim]:
                  b = (v[1]-v[2])/v[1]*100 if v[1] else 0
                  print(f'  {str(k)[:16]:<16} {n(v[0]):>7} don · DT {n(v[1]):>16} · von {n(v[2]):>16} · bien {b:>6.1f}%')
          inBang(bySan,'SAN'); inBang(byBu,'BU'); inBang(byDv,'LOAI DICH VU')

          print(f'\n===== THEO NGAY ({len(byNgay)} ngay) =====')
          for k in sorted(byNgay, key=lambda x: (x[3:5], x[0:2])):
              v = byNgay[k]
              b = (v[1]-v[2])/v[1]*100 if v[1] else 0
              print(f'  {k}  {n(v[0]):>6} don · DT {n(v[1]):>15} · von {n(v[2]):>15} · bien {b:>6.1f}%')

          print('\n===== CAN SOI =====')
          print(f'  Dong co tien nhung GIA VON = 0 : {n(von0)}')
          print(f'  Dong THIEU ma san              : {n(thieuSan)}')
          PY
