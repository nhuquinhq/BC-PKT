# Doc file CPV BE T8 bang HAI CACH:
#   Cach 1 — tai thang CSV tu Google (hay hong, thu 6 lan).
#   Cach 2 — goi /api/cpv cua chinh site; site da doc duoc va giu ban nho
#            nen duong nay an toan hon nhieu.
# Cach nao xong thi tom tat cach do; chay ca hai de con doi chieu.
name: Doc file T8

on:
  workflow_dispatch: {}

env:
  PUB: "2PACX-1vR4aNo9LBJ34PRByMwVyyvTxLKcFkh5qg4LNV1WkE-U_LF6zyNDNdNAmcovZrRzT4CdR-NQk8Y1D5O0"

jobs:
  doc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: CACH 1 - tai thang CSV tu Google
        continue-on-error: true
        run: |
          U="https://docs.google.com/spreadsheets/d/e/$PUB/pub?gid=0&single=true&output=csv"
          for lan in 1 2 3 4 5 6; do
            rm -f /tmp/t8.csv
            code=$(curl -sSL -m 100 -o /tmp/t8.csv -w '%{http_code}' "$U" || echo 000)
            sz=$(stat -c%s /tmp/t8.csv 2>/dev/null || echo 0)
            h=$(head -c 12 /tmp/t8.csv 2>/dev/null | tr -d '\n')
            echo "lan $lan: HTTP $code · $sz byte"
            case "$h" in '<!DOCTYPE'*|'<html'*) echo '   -> trang loi HTML'; sleep 15; continue ;; esac
            if [ "$code" = "200" ] && [ "$sz" -gt 100000 ]; then echo '   -> DUOC'; exit 0; fi
            sleep 15
          done
          echo "CACH 1 THAT BAI — Google van khong xuat duoc"
          rm -f /tmp/t8.csv
          exit 1

      - name: CACH 2 - goi /api/cpv cua site
        run: |
          E="https%3A%2F%2Fdocs.google.com%2Fspreadsheets%2Fd%2Fe%2F$PUB%2Fpubhtml%3Fgid%3D0%26single%3Dtrue"
          for lan in 1 2 3; do
            rm -f /tmp/t8.json
            code=$(curl -sS -m 280 -o /tmp/t8.json -w '%{http_code}' "https://bc-pkt.vercel.app/api/cpv?url=$E&gid=0" || echo 000)
            sz=$(stat -c%s /tmp/t8.json 2>/dev/null || echo 0)
            echo "lan $lan: HTTP $code · $sz byte"
            [ "$code" = "200" ] && [ "$sz" -gt 5000 ] && echo '   -> DUOC' && break
            head -c 200 /tmp/t8.json; echo
            sleep 20
          done

      - name: Tom tat
        run: |
          python3 - <<'PY'
          import json, os, collections, csv, re
          n = lambda x: f'{x:,.0f}'.replace(',', '.')

          if os.path.exists('/tmp/t8.csv') and os.path.getsize('/tmp/t8.csv') > 100000:
              csv.field_size_limit(10**9)
              rows = list(csv.reader(open('/tmp/t8.csv', encoding='utf-8', errors='ignore')))
              print(f'== CACH 1 (CSV thang): doc duoc {len(rows)} dong ==')
              print('  Dong dau:', ','.join(c.strip()[:24] for c in rows[0][:6]))
          else:
              print('== CACH 1 (CSV thang): KHONG doc duoc ==')

          if not (os.path.exists('/tmp/t8.json') and os.path.getsize('/tmp/t8.json') > 5000):
              print('\n== CACH 2 (API site): KHONG doc duoc ==')
              raise SystemExit

          d = json.load(open('/tmp/t8.json', encoding='utf-8'))
          det = d.get('detail') or []
          m = d.get('meta') or {}
          print(f'\n== CACH 2 (API site): {len(det)} dong gop ==')
          print('  Ky du lieu :', m.get('from'), '->', m.get('to'))
          print('  Dong dung  :', m.get('rows_used'), '· don fail', m.get('don_fail'), '· don huy', m.get('don_huy'))
          bn = m.get('bo_nho') or {}
          if bn:
              print('  Ban nho    : tuoi', round((bn.get('tuoi_giay') or 0)/60), 'phut · dang lam moi', bn.get('dang_lam_moi'))
              if bn.get('loi_doc_moi'): print('  Loi doc moi:', bn['loi_doc_moi'])
          if m.get('main_error'): print('  !! THIEU FILE:', m['main_error'])
          if m.get('api_error'):  print('  !! LOI FILE API:', m['api_error'])

          if det: print('\n  Cac truong moi dong:', ', '.join(sorted(det[0].keys())))

          g = lambda r, k: r.get(k) or 0
          tien = sum(g(r,'thanh_tien') for r in det)
          von  = sum(g(r,'gia_von') for r in det)
          phi  = sum(g(r,'phi_san_vnd') for r in det)
          usd  = sum(g(r,'doanh_thu_usd') for r in det)
          don  = sum(g(r,'so_don') for r in det)
          print(f'\n===== TONG =====')
          print(f'  Doanh thu goc (USD): {usd:,.2f}')
          print(f'  Thanh tien (VND)   : {n(tien)}')
          print(f'  Phi san            : {n(phi)}')
          print(f'  Gia von            : {n(von)}')
          print(f'  Loi nhuan gop      : {n(tien-von)}')
          print(f'  % gia von / DT     : {von/tien*100:.2f}%' if tien else '')
          print(f'  So don             : {n(don)}')

          def top(key, ten, lim=30):
              m2 = collections.defaultdict(lambda: [0,0,0])
              for r in det:
                  k = (r.get(key) or '—')
                  m2[k][0] += g(r,'so_don'); m2[k][1] += g(r,'thanh_tien'); m2[k][2] += g(r,'gia_von')
              print(f'\n===== THEO {ten} ({len(m2)}) =====')
              for k, v in sorted(m2.items(), key=lambda x: -x[1][1])[:lim]:
                  bien = (v[1]-v[2])/v[1]*100 if v[1] else 0
                  print(f'  {str(k):<14} {n(v[0]):>7} don · DT {n(v[1]):>16} · von {n(v[2]):>16} · bien {bien:>6.1f}%')
          top('san','SAN'); top('bu','BU'); top('spdv','SPDV')

          mn = collections.defaultdict(lambda: [0,0,0])
          for r in det:
              k = r.get('ngay') or '—'
              mn[k][0] += g(r,'so_don'); mn[k][1] += g(r,'thanh_tien'); mn[k][2] += g(r,'gia_von')
          print(f'\n===== THEO NGAY ({len(mn)} ngay) =====')
          for k in sorted(mn, key=lambda x: (x[6:10], x[3:5], x[0:2])):
              v = mn[k]
              bien = (v[1]-v[2])/v[1]*100 if v[1] else 0
              print(f'  {k}  {n(v[0]):>6} don · DT {n(v[1]):>16} · von {n(v[2]):>16} · bien {bien:>6.1f}%')

          nc = d.get('no_cost_list') or []
          dup = d.get('dup_list') or []
          print(f'\n===== CAN SOI =====')
          print(f'  Don CO tien nhung CHUA co gia von : {len(nc)}')
          print(f'  Ma don TRUNG                      : {len(dup)}')
          PY
