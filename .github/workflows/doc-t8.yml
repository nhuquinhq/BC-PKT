# Doc file CPV BE T8. Da biet chinh xac khuon cot nen chi dinh thang,
# khong do theo ten nua: file co BA cot ten "Gia von" (23, 26, 39) va HAI
# cot ngay (15 "Ngay tao", 29 "Ngay") — do theo ten se bat nham cot dau.
name: Doc file T8

on:
  workflow_dispatch: {}

env:
  PUB: "2PACX-1vR4aNo9LBJ34PRByMwVyyvTxLKcFkh5qg4LNV1WkE-U_LF6zyNDNdNAmcovZrRzT4CdR-NQk8Y1D5O0"

jobs:
  doc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Tai CSV - thu toi 8 lan
        run: |
          U="https://docs.google.com/spreadsheets/d/e/$PUB/pub?gid=0&single=true&output=csv"
          for lan in 1 2 3 4 5 6 7 8; do
            rm -f /tmp/t8.csv
            code=$(curl -sSL -m 100 -o /tmp/t8.csv -w '%{http_code}' "$U" || echo 000)
            sz=$(stat -c%s /tmp/t8.csv 2>/dev/null || echo 0)
            h=$(head -c 12 /tmp/t8.csv 2>/dev/null | tr -d '\n')
            echo "lan $lan: HTTP $code · $sz byte"
            case "$h" in '<!DOCTYPE'*|'<html'*) echo '   -> trang loi HTML'; sleep 15; continue ;; esac
            if [ "$code" = "200" ] && [ "$sz" -gt 100000 ]; then echo "   -> DUOC"; exit 0; fi
            sleep 15
          done
          echo "KHONG TAI DUOC SAU 8 LAN"; exit 1

      - name: Phan tich
        run: |
          python3 - <<'PY'
          import csv, re, collections
          csv.field_size_limit(10**9)
          rows = list(csv.reader(open('/tmp/t8.csv', encoding='utf-8', errors='ignore')))
          n = lambda x: f'{x:,.0f}'.replace(',', '.')
          HDR = 4
          cols = [c.strip() for c in rows[HDR]]

          # Cot chi dinh thang — doi chieu voi khoi tong o dau file
          C = {'san':2, 'dv':17, 'tt':18, 'usd':7, 'phi':8, 'thuc_nhan':9,
               'ngay':29, 'thang':30, 'gmv':34, 'co':39, 'ln':40, 'pl_dt':36, 'pl_hang':38}
          print('===== COT DANG DUNG =====')
          for k, j in C.items():
              print(f'  {k:<10} cot {j:>2} = {cols[j] if j < len(cols) else "?"}')

          def viNum(s):
              s = str(s or '').strip().replace(' ', '')
              if not s or s == '-': return 0.0
              am = s.startswith('-') or (s.startswith('(') and s.endswith(')'))
              s = s.strip('()-')
              if ',' in s and '.' in s: s = s.replace('.','').replace(',','.')
              elif re.search(r',\d{1,2}$', s): s = s.replace('.','').replace(',','.')
              else: s = re.sub(r'[.,](?=\d{3}\b)', '', s)
              try: v = float(s)
              except ValueError: return 0.0
              return -v if am else v
          v = lambda r, k: (r[C[k]] if C[k] < len(r) else '')

          print('\n===== TONG TREN DAU FILE (do Google tinh san) =====')
          for i in (0, 1, 2):
              cel = [c.strip() for c in rows[i][2:4] if c.strip()]
              if cel: print('  ', ' = '.join(cel))

          agg = lambda: collections.defaultdict(lambda: [0, 0.0, 0.0])
          bySan, byDv, byNgay, byPl = agg(), agg(), agg(), agg()
          tt = collections.Counter()
          gmv = co = usd = phi = thuc = 0.0
          don = 0; co0 = 0
          for r in rows[HDR+1:]:
              if not any(c.strip() for c in r): continue
              s = v(r, 'san').strip()
              st = v(r, 'tt').strip()
              if not s and not st: continue          # dong trong cua bang
              don += 1
              tt[st or '(trong)'] += 1
              g = viNum(v(r,'gmv')); c = viNum(v(r,'co'))
              gmv += g; co += c
              usd += viNum(v(r,'usd')); phi += viNum(v(r,'phi')); thuc += viNum(v(r,'thuc_nhan'))
              if g and not c: co0 += 1
              for box, key in ((bySan, s or '(trong)'), (byDv, v(r,'dv').strip() or '—'),
                               (byPl, v(r,'pl_dt').strip() or '—')):
                  box[key][0] += 1; box[key][1] += g; box[key][2] += c
              d = v(r,'ngay').strip()
              m = re.search(r'(\d{1,2})[/-](\d{1,2})[/-](\d{4})', d) or re.search(r'(\d{4})-(\d{2})-(\d{2})', d)
              if m:
                  k = f'{int(m.group(1)):02d}/{int(m.group(2)):02d}' if '/' in d or '-' in d and len(m.group(1)) <= 2 else f'{int(m.group(3)):02d}/{int(m.group(2)):02d}'
                  byNgay[k][0] += 1; byNgay[k][1] += g; byNgay[k][2] += c

          print(f'\n===== TONG TINH LAI TU {n(don)} DONG DON =====')
          print(f'  GMV (Thanh tien)   : {n(gmv)}')
          print(f'  Gia von (CO)       : {n(co)}')
          print(f'  Loi nhuan gop      : {n(gmv-co)}')
          if gmv:
              print(f'  % gia von / GMV    : {co/gmv*100:.2f}%')
              print(f'  Bien loi nhuan gop : {(gmv-co)/gmv*100:.2f}%')
          print(f'  Doanh thu goc (USD): {usd:,.2f}')
          print(f'  Phi san (USD)      : {phi:,.2f}')
          print(f'  DThu thuc nhan(USD): {thuc:,.2f}')

          print('\n===== TRANG THAI DON =====')
          for k, c in tt.most_common(10): print(f'  {n(c):>7}  {k}')

          def inBang(box, ten, lim=30):
              print(f'\n===== THEO {ten} ({len(box)}) =====')
              for k, x in sorted(box.items(), key=lambda y: -y[1][1])[:lim]:
                  b = (x[1]-x[2])/x[1]*100 if x[1] else 0
                  print(f'  {str(k)[:22]:<22} {n(x[0]):>6} don · GMV {n(x[1]):>15} · CO {n(x[2]):>15} · bien {b:>6.1f}%')
          inBang(bySan,'SAN'); inBang(byDv,'DICH VU'); inBang(byPl,'PHAN LOAI DOANH THU')

          print(f'\n===== THEO NGAY ({len(byNgay)}) =====')
          for k in sorted(byNgay, key=lambda x: (x[3:5], x[0:2])):
              x = byNgay[k]
              b = (x[1]-x[2])/x[1]*100 if x[1] else 0
              print(f'  {k}  {n(x[0]):>5} don · GMV {n(x[1]):>14} · CO {n(x[2]):>14} · bien {b:>6.1f}%')

          print('\n===== CAN SOI =====')
          print(f'  Don co GMV nhung CHUA co gia von : {n(co0)}')
          PY
