# Chẩn đoán tốc độ / lỗi đọc dữ liệu CPV — chạy tay khi bot hoặc dashboard
# báo không đọc được file. Thử nhiều kiểu link xuất của Google để tìm đường
# nào còn dùng được (pub?output=csv hay bị 400/500 với file nặng).
name: Chan doan CPV

on:
  workflow_dispatch: {}

jobs:
  do-toc-do:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Thu cac kieu link xuat cua Google
        run: |
          K='2PACX-1vR4aNo9LBJ34PRByMwVyyvTxLKcFkh5qg4LNV1WkE-U_LF6zyNDNdNAmcovZrRzT4CdR-NQk8Y1D5O0'
          thu() {
            echo "--- $1"
            curl -sS -L -o /tmp/o.bin -w '    HTTP %{http_code} · %{time_total}s · %{size_download} bytes\n' -m 70 "$2" || echo "    LOI/TIMEOUT"
            head -c 120 /tmp/o.bin | tr -d '\n'; echo
          }
          thu "A. pub?output=csv&gid=0"            "https://docs.google.com/spreadsheets/d/e/$K/pub?output=csv&gid=0"
          thu "B. pub?gid=0&single=true&output=csv" "https://docs.google.com/spreadsheets/d/e/$K/pub?gid=0&single=true&output=csv"
          thu "C. pubhtml?gid=0&single=true"       "https://docs.google.com/spreadsheets/d/e/$K/pubhtml?gid=0&single=true"
          thu "D. pub?output=tsv&gid=0"            "https://docs.google.com/spreadsheets/d/e/$K/pub?output=tsv&gid=0"

          echo "=== Endpoint tren Vercel ==="
          curl -sS -o /tmp/r.json -w '    HTTP %{http_code} · %{time_total}s\n' -m 280 \
            'https://bc-pkt.vercel.app/api/bot/cpv?preview=1' || echo "    LOI/TIMEOUT"
          head -c 400 /tmp/r.json 2>/dev/null; echo
