# Kiểm tra nhanh 2 thứ: PKT3 đọc được file Báo cáo TIỀN chưa, và hôm nay
# bot đã bắn những khung giờ nào (đọc khoá chống trùng, không gửi tin).
name: Kiem tra nguon du lieu

on:
  workflow_dispatch: {}

jobs:
  do-toc-do:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Kiem tra
        run: |
          goi() {
            echo "===== $1"
            curl -sS -o /tmp/o.json -w '   HTTP %{http_code} · %{time_total}s\n' -m 280 "$2" || echo '   LOI/TIMEOUT'
            head -c 700 /tmp/o.json | tr -d '\n'; echo; echo
          }
          goi "1. Bot da ban khung nao hom nay" \
            "https://bc-pkt.vercel.app/api/bot/cpv?trangthai=1"
          goi "2. Bot da ban khung nao ngay 06/08" \
            "https://bc-pkt.vercel.app/api/bot/cpv?trangthai=1&date=06/08/2026"
          goi "3. PKT3 doc file Bao cao TIEN ver4" \
            "https://bc-pkt.vercel.app/api/tien?gids=116298870,959678702,513088085,1068979883,731668787,2029983632&url=https%3A%2F%2Fdocs.google.com%2Fspreadsheets%2Fd%2Fe%2F2PACX-1vTLTvWG0zTceE2zZ1-f-8EDouwxfQUWj-LBDj0K4qXsbvOO1mdp2pbt7pqvraPj6gfTnq0oQORAIRWb%2Fpubhtml"
