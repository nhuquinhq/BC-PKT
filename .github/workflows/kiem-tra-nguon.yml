# Nhận diện tab của file công bố: tải vài dòng đầu CSV của từng gid rồi
# in ra để biết gid nào ứng với tab nào.
name: Kiem tra nguon du lieu

on:
  workflow_dispatch: {}

jobs:
  do-toc-do:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Nhan dien gid
        run: |
          K='2PACX-1vTLTvWG0zTceE2zZ1-f-8EDouwxfQUWj-LBDj0K4qXsbvOO1mdp2pbt7pqvraPj6gfTnq0oQORAIRWb'
          for G in 116298870 959678702 513088085 1068979883 731668787 2029983632; do
            echo "===== gid=$G"
            curl -sS -L -m 90 -r 0-1200 \
              "https://docs.google.com/spreadsheets/d/e/$K/pub?gid=$G&single=true&output=csv" \
              -o /tmp/t.csv -w '   HTTP %{http_code} · %{time_total}s\n' || echo '   LOI'
            head -c 400 /tmp/t.csv | tr '\n' '|'; echo; echo
          done
