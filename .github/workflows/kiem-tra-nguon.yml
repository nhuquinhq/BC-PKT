# Chẩn đoán đường đọc dữ liệu — chạy tay khi trang báo không đọc được file.
# Kiểm tra cả nguồn CPV (Google pub CSV) lẫn nguồn Báo cáo TIỀN (/api/tien).
name: Kiem tra nguon du lieu

on:
  workflow_dispatch: {}

jobs:
  do-toc-do:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Kiem tra endpoint
        run: |
          goi() {
            echo "--- $1"
            curl -sS -o /tmp/o.json -w '    HTTP %{http_code} · %{time_total}s · %{size_download} bytes\n' -m 280 "$2" || echo "    LOI/TIMEOUT"
            head -c 900 /tmp/o.json | tr -d '\n'; echo; echo
          }
          goi "1. Bao cao TIEN (PKT3)" "https://bc-pkt.vercel.app/api/tien?url=https%3A%2F%2Fdocs.google.com%2Fspreadsheets%2Fd%2Fe%2F2PACX-1vTLTvWG0zTceE2zZ1-f-8EDouwxfQUWj-LBDj0K4qXsbvOO1mdp2pbt7pqvraPj6gfTnq0oQORAIRWb%2Fpubhtml"
          goi "2. Bot CPV preview" "https://bc-pkt.vercel.app/api/bot/cpv?preview=1"
