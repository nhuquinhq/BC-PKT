# Chẩn đoán đường đọc dữ liệu — chạy tay khi trang báo không đọc được file.
name: Kiem tra nguon du lieu

on:
  workflow_dispatch: {}

jobs:
  do-toc-do:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Soi cau truc menu tab cua file cong bo
        run: |
          K='2PACX-1vTLTvWG0zTceE2zZ1-f-8EDouwxfQUWj-LBDj0K4qXsbvOO1mdp2pbt7pqvraPj6gfTnq0oQORAIRWb'
          curl -sS -L -o /tmp/pub.html -w 'pubhtml: HTTP %{http_code} · %{time_total}s · %{size_download} bytes\n' -m 120 \
            "https://docs.google.com/spreadsheets/d/e/$K/pubhtml"
          echo "=== cac chuoi chua gid ==="
          grep -o 'gid=[0-9]*' /tmp/pub.html | sort -u | head -30
          echo "=== sheet-button ==="
          grep -o 'sheet-button-[0-9]*' /tmp/pub.html | sort -u | head -30
          echo "=== doan quanh sheet-menu ==="
          grep -o 'sheet-menu.\{0,1500\}' /tmp/pub.html | head -c 2000; echo
          echo "=== 400 ky tu dau ==="
          head -c 400 /tmp/pub.html; echo
