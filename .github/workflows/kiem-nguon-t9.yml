# Goi thang API tren ban da trien khai, doi chieu so voi file goc.
# Doi nguon xong ma khong goi thu thi khong biet trang co ra so hay khong —
# da tung doi nguon roi ca ngay sau moi phat hien trang bao 502.
name: Kiem nguon T9 tren ban chay

on:
  workflow_dispatch: {}

env:
  GOC: "https://bc-pkt.vercel.app"

jobs:
  kiem:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Goi /api/cpv (nguon BE T9)
        run: |
          BE="https://docs.google.com/spreadsheets/d/e/2PACX-1vS0Tldb2hmR8TxnYC_un9q0tpgpm3RCyN3O7oJimo17gP4EpagCRwEPwpqMr2BjdZtXeRVOcthy23PX/pubhtml?gid=0&single=true"
          API="https://docs.google.com/spreadsheets/d/1GpOFicbNTmkxCCe9488516LPx31ryZTAVwS9hSxEL7U/edit?gid=0"
          for i in 1 2 3; do
            code=$(curl -sS -m 280 -G "$GOC/api/cpv" \
              --data-urlencode "url=$BE" --data-urlencode 'gid=0' \
              --data-urlencode "url2=$API" --data-urlencode 'gid2=0' \
              --data-urlencode 'hist=1' --data-urlencode 'moi=1' \
              -o /tmp/cpv.json -w '%{http_code}') || code=000
            echo "   luot $i: HTTP $code · $(stat -c%s /tmp/cpv.json 2>/dev/null || echo 0) byte"
            [ "$code" = "200" ] && break
            sleep 10
          done
          head -c 400 /tmp/cpv.json; echo

      # T8 va T9 deu da vao datalake nen PKT6 khong con doc file live nao.
      - name: Goi /api/vi (chi datalake)
        run: |
          for i in 1 2 3; do
            code=$(curl -sS -m 280 -G "$GOC/api/vi" \
              --data-urlencode 'hist=1' \
              -o /tmp/vi.json -w '%{http_code}') || code=000
            echo "   luot $i: HTTP $code · $(stat -c%s /tmp/vi.json 2>/dev/null || echo 0) byte"
            [ "$code" = "200" ] && break
            sleep 10
          done
          head -c 400 /tmp/vi.json; echo

      - name: Tong hop
        run: |
          node - <<'JS'
          const fs = require('fs');
          const n = (x) => new Intl.NumberFormat('vi-VN', { maximumFractionDigits: 0 }).format(x);
          for (const [ten, f] of [['/api/cpv', '/tmp/cpv.json'], ['/api/vi', '/tmp/vi.json']]) {
            console.log(`##### ${ten}`);
            let j;
            try { j = JSON.parse(fs.readFileSync(f, 'utf8')); }
            catch { console.log('   không đọc được JSON\n'); continue; }
            if (j.error) { console.log(`   LỖI: ${j.error}\n`); continue; }
            const d = j.detail || [];
            console.log(`   ${n(d.length)} nhóm · meta: ${JSON.stringify(j.meta).slice(0, 600)}`);
            const theo = {};
            for (const r of d) {
              const k = r.sortKey.slice(0, 6);
              (theo[k] ||= [0, 0, 0]);
              theo[k][0] += r.so_don || 0;
              theo[k][1] += r.thanh_tien || 0;
              theo[k][2] += r.gia_von || 0;
            }
            for (const k of Object.keys(theo).sort()) {
              console.log(`   ${k}  ${String(theo[k][0]).padStart(7)} đơn · ${n(theo[k][1]).padStart(18)} đ · GV ${n(theo[k][2]).padStart(18)} đ`);
            }
            console.log();
          }
          JS
