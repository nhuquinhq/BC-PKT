<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Báo cáo Phòng Kế Toán — HQ Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05070f;
  --glass:rgba(255,255,255,.045);
  --glass-2:rgba(255,255,255,.075);
  --line:rgba(255,255,255,.10);
  --line-2:rgba(255,255,255,.18);
  --ink:#eaf0ff;
  --ink-2:#a6b3d4;
  --ink-3:#6c7ba3;
  --v1:#7c5cff;
  --v2:#4b8dff;
  --cy:#22d3ee;
  --pk:#f472b6;
  --gain:#34d399;
  --loss:#fb7185;
  --warn:#fbbf24;
  --f:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --m:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(760px 420px at 12% -6%, rgba(124,92,255,.30), transparent 62%),
    radial-gradient(680px 420px at 88% 4%, rgba(34,211,238,.16), transparent 60%),
    radial-gradient(900px 600px at 50% 108%, rgba(75,141,255,.16), transparent 66%);}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
::-webkit-scrollbar{height:9px;width:9px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}

.wrap{position:relative;z-index:1;display:flex;min-height:100vh}

/* ---------- rail ---------- */
.rail{width:250px;flex:0 0 250px;padding:22px 16px;position:sticky;top:0;height:100vh;overflow-y:auto;
  background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02));
  border-right:1px solid var(--line);backdrop-filter:blur(18px)}
.brand{display:flex;align-items:center;gap:11px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-family:var(--m);font-weight:500;font-size:15px;color:#fff;
  background:linear-gradient(135deg,var(--v1),var(--v2));box-shadow:0 0 22px rgba(124,92,255,.55)}
.brand .t{font-size:14px;font-weight:600;letter-spacing:-.01em}
.brand .s{font-size:10.5px;color:var(--ink-3);margin-top:2px}
.rail-lb{font-family:var(--m);font-size:9.5px;letter-spacing:.2em;color:var(--ink-3);padding:20px 6px 9px}
.nav{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:11px;border:1px solid transparent;transition:.18s;margin-bottom:3px}
.nav:hover{background:var(--glass);border-color:var(--line)}
.nav.on{background:linear-gradient(90deg,rgba(124,92,255,.28),rgba(124,92,255,.05));border-color:rgba(124,92,255,.45);box-shadow:0 0 20px rgba(124,92,255,.18)}
.nav .c{font-family:var(--m);font-size:9.5px;color:var(--cy);padding-top:3px;min-width:32px}
.nav.on .c{color:#9ff3ff}
.nav .n{font-size:12.5px;color:var(--ink);line-height:1.35}
.nav .sla{font-family:var(--m);font-size:9.5px;color:var(--ink-3)}

/* ---------- main ---------- */
.main{flex:1;min-width:0}
.top{padding:22px 30px 18px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,0));backdrop-filter:blur(14px);
  position:sticky;top:0;z-index:9}
.top-row{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap}
.eyebrow{font-family:var(--m);font-size:9.5px;letter-spacing:.18em;color:var(--cy)}
.top h1{margin:8px 0 4px;font-size:24px;font-weight:600;letter-spacing:-.02em}
.top .sub{color:var(--ink-2);font-size:12.5px;max-width:700px;line-height:1.55}
.content{padding:24px 30px 70px;max-width:1620px}

/* ---------- controls ---------- */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--glass)}
.seg button{border:0;background:transparent;color:var(--ink-2);padding:7px 15px;font-size:12px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:linear-gradient(135deg,var(--v1),var(--v2));color:#fff;box-shadow:0 0 18px rgba(124,92,255,.5)}
.lb{display:block;font-family:var(--m);font-size:9.5px;letter-spacing:.14em;color:var(--ink-3);margin-bottom:6px}
.btn{border:1px solid var(--line-2);background:var(--glass);color:var(--ink);padding:8px 15px;border-radius:10px;font-size:12px;transition:.18s}
.btn:hover{background:var(--glass-2);border-color:rgba(124,92,255,.6)}
.btn.primary{border:0;background:linear-gradient(135deg,var(--v1),var(--v2));color:#fff;box-shadow:0 0 20px rgba(124,92,255,.45)}
.inp{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:8px 11px;font-size:12.5px;font-family:inherit;min-width:150px}

/* ---------- glass panel ---------- */
.card{background:var(--glass);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(16px);margin-bottom:18px;overflow:hidden}
.card-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:14px;
  background:linear-gradient(180deg,rgba(255,255,255,.045),transparent)}
.card-h h2{margin:0;font-size:14px;font-weight:600}
.card-h .hint{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.card-b{padding:18px}

/* ---------- kpi ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:13px;margin-bottom:20px}
.kpi{position:relative;background:var(--glass);border:1px solid var(--line);border-radius:15px;padding:15px 16px;backdrop-filter:blur(16px);overflow:hidden;transition:.2s}
.kpi:hover{border-color:rgba(124,92,255,.55);transform:translateY(-2px)}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--v1);box-shadow:0 0 16px var(--v1)}
.kpi.gain::after{background:var(--gain);box-shadow:0 0 16px var(--gain)}
.kpi.loss::after{background:var(--loss);box-shadow:0 0 16px var(--loss)}
.kpi.warn::after{background:var(--warn);box-shadow:0 0 16px var(--warn)}
.kpi.flip::after{background:var(--cy);box-shadow:0 0 16px var(--cy)}
.chip{display:inline-block;font-family:var(--m);font-size:9px;letter-spacing:.12em;padding:3px 8px;border-radius:6px;
  color:#a8f6ff;background:rgba(34,211,238,.12);border:1px solid rgba(34,211,238,.32)}
.kpi .l{font-size:11.5px;color:var(--ink-2);margin-top:10px;line-height:1.35;min-height:31px}
.kpi .v{font-family:var(--m);font-size:23px;margin-top:3px;letter-spacing:-.02em;color:#fff;text-shadow:0 0 22px rgba(124,92,255,.55)}
.kpi .v.na{color:rgba(255,255,255,.20);text-shadow:none}
.kpi .v.gain{color:#6ee7b7;text-shadow:0 0 20px rgba(52,211,153,.5)}
.kpi .v.loss{color:#fda4af;text-shadow:0 0 20px rgba(251,113,133,.5)}
.kpi .f{font-family:var(--m);font-size:10px;color:var(--ink-3);margin-top:7px}

/* ---------- table ---------- */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{position:sticky;top:0;text-align:left;padding:10px 14px;font-family:var(--m);font-size:9.5px;letter-spacing:.1em;color:var(--ink-2);
  background:rgba(12,17,34,.94);border-bottom:1px solid var(--line-2);white-space:nowrap}
td{padding:9px 14px;border-bottom:1px solid rgba(255,255,255,.055);white-space:nowrap;color:var(--ink)}
td.n,th.n{text-align:right;font-family:var(--m);font-variant-numeric:tabular-nums}
tbody tr:hover td{background:rgba(255,255,255,.045)}
tr.sum td{background:rgba(124,92,255,.13);font-weight:600;border-top:1px solid rgba(124,92,255,.5)}
td.neg{color:#fda4af}
.na{color:rgba(255,255,255,.2)}
.empty{padding:34px;text-align:center;color:var(--ink-3);font-size:12.5px;border:1px dashed var(--line-2);border-radius:13px;background:rgba(255,255,255,.02)}
.tag{display:inline-block;font-family:var(--m);font-size:9.5px;padding:4px 9px;border-radius:7px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--ink-2)}
.tag.sla{color:#fcd77a;background:rgba(251,191,36,.10);border-color:rgba(251,191,36,.3)}
.tag.demo{color:#fbc0d8;background:rgba(244,114,182,.12);border-color:rgba(244,114,182,.35)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(430px,1fr));gap:18px}
.row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.mono{font-family:var(--m)}
.muted{color:var(--ink-3);font-size:11.5px}
.purpose{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.purpose li{position:relative;padding-left:18px;font-size:12.5px;color:var(--ink-2);line-height:1.55}
.purpose li::before{content:"";position:absolute;left:0;top:7px;width:6px;height:6px;border-radius:50%;background:var(--cy);box-shadow:0 0 10px var(--cy)}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-2);border:1px solid var(--line);background:var(--glass);border-radius:999px;padding:6px 13px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--gain);box-shadow:0 0 10px var(--gain)}
@media(max-width:960px){.wrap{flex-direction:column}.rail{width:100%;flex:none;height:auto;position:relative}.content,.top{padding-left:16px;padding-right:16px}}
</style>
</head>
<body>
<div class="wrap">
  <aside class="rail">
    <div class="brand">
      <div class="logo">HQ</div>
      <div>
        <div class="t">Báo cáo Kế Toán</div>
        <div class="s">HQ Group · PKT1–PKT7</div>
      </div>
    </div>
    <div class="rail-lb">BỘ BÁO CÁO</div>
    <div id="nav"></div>
    <div class="rail-lb">TRẠNG THÁI</div>
    <div class="pill"><span class="dot"></span> Bản xem trước giao diện</div>
  </aside>

  <main class="main">
    <div class="top">
      <div class="top-row">
        <div>
          <div class="eyebrow" id="eyebrow"></div>
          <h1 id="title"></h1>
          <div class="sub" id="sub"></div>
        </div>
        <div class="row">
          <div>
            <span class="lb">KỲ BÁO CÁO</span>
            <div class="seg" id="periods"></div>
          </div>
          <button class="btn primary" id="demo">Bật số liệu mẫu</button>
        </div>
      </div>
    </div>
    <div class="content" id="body"></div>
  </main>
</div>

function seedRows(t){
  if(!t.seed) return [];
  return t.seed.map(s=>{ const o={}; t.cols.forEach((c,i)=>{ if(s[i]!==undefined) o[c.k]=s[i]; }); return o; });
}
function baseData(r){
  const d={kpis:{},tables:{}};
  r.kpis.forEach(k=>d.kpis[k.k]=null);
  r.tables.forEach(t=>d.tables[t.id]=seedRows(t));
  if(r.slug==='pkt1'){
    d.tables.daily_rate = PKT1_DAILY;
    const a=PKT1_DAILY, L=a[a.length-1];
    if(L){
      const p7=a[Math.max(0,a.length-8)];
      d.kpis.rub_usdt=L.rub_usdt; d.kpis.idr_usdt=L.idr_usdt;
      d.kpis.usdt_vnd_co=L.usdt_vnd; d.kpis.usdt_vnd_rev=Math.round(L.usdt_vnd*0.98);
      d.kpis.bien_dong_7d=+(((L.usdt_vnd-p7.usdt_vnd)/p7.usdt_vnd)*100).toFixed(2);
    }
  }
  return d;
}

/* ---------- biểu đồ ---------- */
const CC=['#7c5cff','#22d3ee','#f472b6','#34d399','#fbbf24','#4b8dff'];
function chartSvg(ch,rows){
  const W=620,H=250,P={t:16,r:16,b:34,l:64};
  const data=rows.filter(r=>ch.s.some(s=>F.num(r[s.k])!==null));
  if(!data.length) return '<div class="empty">Biểu đồ hiện khi bảng nguồn có dữ liệu.</div>';
  const iw=W-P.l-P.r, ih=H-P.t-P.b;
  const vals=[]; data.forEach(r=>ch.s.forEach(s=>{const v=F.num(r[s.k]); if(v!==null)vals.push(v);}));
  let mn=Math.min(...vals), mx=Math.max(...vals);
  if(ch.type!=='line'){ mn=Math.min(0,mn); }
  if(mn===mx){mx=mn+1;}
  const pad=(mx-mn)*0.08; mn-=pad; mx+=pad;
  const Y=v=>P.t+ih-((v-mn)/(mx-mn))*ih;
  let g='';
  for(let i=0;i<=4;i++){ const y=P.t+ih*i/4, v=mx-(mx-mn)*i/4;
    g+=`<line x1="${P.l}" y1="${y}" x2="${W-P.r}" y2="${y}" stroke="rgba(255,255,255,.07)"/>`+
       `<text x="${P.l-8}" y="${y+3}" text-anchor="end" font-size="9.5" font-family="monospace" fill="#6c7ba3">${F.compact(v)}</text>`;}
  if(ch.type==='donut'){
    const key=ch.s[0].k, tot=data.reduce((a,r)=>a+Math.abs(F.num(r[key])||0),0);
    let ang=-Math.PI/2, arcs='', lg='';
    data.forEach((r,i)=>{const v=Math.abs(F.num(r[key])||0); if(!v)return;
      const a2=ang+(v/tot)*Math.PI*2, R1=92,R2=54,cx=150,cy=125,la=(a2-ang)>Math.PI?1:0;
      arcs+=`<path d="M${cx+R1*Math.cos(ang)},${cy+R1*Math.sin(ang)} A${R1},${R1} 0 ${la} 1 ${cx+R1*Math.cos(a2)},${cy+R1*Math.sin(a2)} L${cx+R2*Math.cos(a2)},${cy+R2*Math.sin(a2)} A${R2},${R2} 0 ${la} 0 ${cx+R2*Math.cos(ang)},${cy+R2*Math.sin(ang)} Z" fill="${CC[i%6]}" opacity=".85"/>`;
      lg+=`<g transform="translate(300,${34+i*24})"><rect width="10" height="10" rx="2" fill="${CC[i%6]}"/><text x="17" y="9" font-size="11" fill="#a6b3d4">${String(r[ch.x]).slice(0,26)} · ${((v/tot)*100).toFixed(1)}%</text></g>`;
      ang=a2;});
    return `<svg viewBox="0 0 620 250" style="width:100%;height:auto">${arcs}${lg}</svg>`;
  }
  let body='';
  if(ch.type==='line'){
    ch.s.forEach((s,si)=>{
      const pts=data.map((r,i)=>{const v=F.num(r[s.k]); return v===null?null:`${(P.l+(iw*i)/(data.length-1||1)).toFixed(1)},${Y(v).toFixed(1)}`;}).filter(Boolean);
      body+=`<polyline points="${pts.join(' ')}" fill="none" stroke="${CC[si%6]}" stroke-width="2.2" stroke-linejoin="round"/>`;
      const last=pts[pts.length-1].split(',');
      body+=`<circle cx="${last[0]}" cy="${last[1]}" r="3.4" fill="${CC[si%6]}"/>`;
    });
  } else {
    const bw=iw/data.length, n=ch.s.length, w=Math.min(26,(bw-10)/n);
    data.forEach((r,i)=>{ ch.s.forEach((s,si)=>{ const v=F.num(r[s.k]); if(v===null)return;
      const x=P.l+bw*i+bw/2-(n*w)/2+si*w, y0=Y(0), y=Y(v);
      body+=`<rect x="${x.toFixed(1)}" y="${Math.min(y,y0).toFixed(1)}" width="${(w-3).toFixed(1)}" height="${Math.max(2,Math.abs(y0-y)).toFixed(1)}" rx="2" fill="${CC[si%6]}" opacity=".88"/>`;});});
  }
  let xl='';
  const step=Math.ceil(data.length/7);
  data.forEach((r,i)=>{ if(i%step)return;
    const x=ch.type==='line'?P.l+(iw*i)/(data.length-1||1):P.l+(iw/data.length)*i+(iw/data.length)/2;
    let t=String(r[ch.x]??''); if(t.length>10)t=t.slice(5).replace(/-/g,'/');
    xl+=`<text x="${x.toFixed(1)}" y="${H-12}" text-anchor="middle" font-size="9.5" font-family="monospace" fill="#6c7ba3">${t}</text>`;});
  let lg='';
  ch.s.forEach((s,i)=>{lg+=`<g transform="translate(${P.l+i*120},${H-2})"><rect width="9" height="9" rx="2" fill="${CC[i%6]}"/><text x="15" y="8" font-size="10.5" fill="#a6b3d4">${s.l}</text></g>`;});
  return `<svg viewBox="0 0 620 262" style="width:100%;height:auto">${g}${body}${xl}${lg}</svg>`;
}

/* ---------- render ---------- */
let cur='pkt1', demoOn=false;
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

function renderNav(){
  document.getElementById('nav').innerHTML = R.map(r=>
    `<a class="nav${r.slug===cur?' on':''}" href="#" onclick="go('${r.slug}');return false">
      <span class="c">${r.code}</span><span><span class="n">${r.short}</span><br><span class="sla">SLA ${r.sla}</span></span></a>`).join('');
}
function tableHtml(t,rows){
  const head=t.cols.map(c=>`<th class="${['money','num','rate','pct'].includes(c.t)?'n':''}">${esc(c.l)}</th>`).join('');
  const body=rows.map(r=>{
    const first=String(r[t.cols[0].k]??'')+' '+String(r[t.cols[1]?.k]??'');
    const sum=/^(RE|PL1|PL2A|PL2|PL7|TA|TL|EQ)\b/.test(first.trim())||/Tổng|Tiền cuối kỳ|Dòng tiền hoạt động/.test(first);
    const tds=t.cols.map(c=>{ const v=F.cell(r[c.k],c.t); const n=['money','num','rate','pct'].includes(c.t);
      const neg=n&&F.num(r[c.k])!==null&&F.num(r[c.k])<0;
      return `<td class="${n?'n':''}${neg?' neg':''}">${v===null?'<span class="na">—</span>':esc(v)}</td>`;}).join('');
    return `<tr class="${sum?'sum':''}">${tds}</tr>`;}).join('');
  return rows.length
    ? `<div class="tw"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`
    : `<div class="card-b"><div class="empty"><b>Bảng chưa có dữ liệu.</b><div style="margin-top:8px" class="mono">Cột cần chuẩn bị: ${t.cols.map(c=>c.k).join(' · ')}</div></div></div>`;
}
function render(){
  const r=R.find(x=>x.slug===cur), d=DATA[cur];
  document.getElementById('eyebrow').textContent=`${r.code} · SLA ${r.sla} · NGUỒN: ${r.src.toUpperCase()}`;
  document.getElementById('title').textContent=r.name;
  document.getElementById('sub').textContent=r.purpose[0];
  document.getElementById('periods').innerHTML=r.periods.map((p,i)=>`<button class="${i===0?'on':''}" onclick="segPick(this)">${p}</button>`).join('');
  document.getElementById('demo').textContent=demoOn?'Tắt số liệu mẫu':'Bật số liệu mẫu';

  let h=`<div class="card"><div class="card-h"><h2>Báo cáo này trả lời câu hỏi gì</h2>
    <span class="row">${demoOn?'<span class="tag demo">SỐ MẪU MINH HOẠ</span>':''}<span class="tag sla">Hạn nộp ${r.sla}</span></span></div>
    <div class="card-b"><ul class="purpose">${r.purpose.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div></div>`;

  h+='<div class="kpis">'+r.kpis.map(k=>{
    const raw=d.kpis[k.k], v=F.kpi(raw,k.t);
    let tone=k.tone||''; if(tone==='auto'){const n=F.num(raw); tone=n===null?'':n>=0?'gain':'loss';}
    const vc=v===null?'na':(tone==='gain'?'gain':tone==='loss'?'loss':'');
    return `<div class="kpi ${tone}"><span class="chip">${esc(k.c)}</span><div class="l">${esc(k.l)}</div>
      <div class="v ${vc}">${v===null?'—':esc(v)}</div>${k.n?`<div class="f">${esc(k.n)}</div>`:''}</div>`;}).join('')+'</div>';

  r.tables.forEach(t=>{ const rows=d.tables[t.id]||[];
    h+=`<div class="card"><div class="card-h"><div><h2>${esc(t.title)}</h2>${t.hint?`<div class="hint">${esc(t.hint)}</div>`:''}</div>
      <span class="row"><span class="tag">${rows.length} dòng</span><button class="btn">Tải CSV</button></span></div>${tableHtml(t,rows)}</div>`;});

  h+='<div class="g2">'+r.charts.map(c=>
    `<div class="card"><div class="card-h"><h2>${esc(c.title)}</h2><span class="tag">${c.tbl}</span></div>
      <div class="card-b">${chartSvg(c,d.tables[c.tbl]||[])}</div></div>`).join('')+'</div>';

  document.getElementById('body').innerHTML=h;
  renderNav();
  window.scrollTo({top:0});
}
function go(s){cur=s;render();}
function segPick(b){[...b.parentNode.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');}
document.getElementById('demo').onclick=()=>{
  demoOn=!demoOn;
  R.forEach(r=>DATA[r.slug]=baseData(r));
  if(demoOn) demoFill();
  render();
};
render();
